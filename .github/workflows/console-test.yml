name: Console Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/console-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

  bff:
    name: BFF compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/bff
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and compile
        env:
          TENANTS_TOML_PATH: /tmp/tenants.toml
          BFF_SESSION_SECRET: ci-session-secret
          BFF_ADMIN_TOKEN: ci-admin-token
        run: |
          pip install -r requirements.txt
          python -m compileall app
          python -c "from app.main import app"
          python -m unittest discover -s tests -v
