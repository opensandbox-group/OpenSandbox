name: Helm Docs Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'manifests/charts/**'
      - 'manifests/Makefile'
      - '.github/workflows/helm-docs.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helm-docs:
    name: Verify chart documentation is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install helm-docs
        run: |
          HELM_DOCS_VERSION="1.14.2"
          curl -sSfL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" -o /tmp/helm-docs.tar.gz
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp
          sudo mv /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.21.3'

      - name: Lint all charts
        working-directory: manifests
        run: |
          make helm-lint

      - name: Verify fast-sandbox RBAC follows the runtime switch
        working-directory: manifests
        run: |
          set -euo pipefail

          # Disabled runtime: no leftover control-plane RBAC (issue #2909).
          disabled="$(helm template opensandbox charts/opensandbox --set fast-sandbox.enabled=false)"
          if grep -Eq 'name: fast-sandbox-(controller|fastpath|fastlet-issuer-discovery|controller-token-minter|fastpath-token-minter)' <<<"$disabled"; then
            echo "::error::fast-sandbox control-plane RBAC rendered while fast-sandbox.enabled=false" >&2
            exit 1
          fi

          # Enabled runtime: the same switch renders the full permission set.
          enabled="$(helm template opensandbox charts/opensandbox --set fast-sandbox.enabled=true)"
          for resource in \
            fast-sandbox-controller \
            fast-sandbox-fastpath \
            fast-sandbox-fastlet-issuer-discovery \
            fast-sandbox-controller-token-minter \
            fast-sandbox-fastpath-token-minter; do
            grep -Fq "name: $resource" <<<"$enabled" || {
              echo "::error::missing $resource while fast-sandbox.enabled=true" >&2
              exit 1
            }
          done
          if grep -Eq '^[[:space:]]+name: system:unauthenticated$' <<<"$enabled"; then
            echo "::error::anonymous issuer-discovery binding rendered; the fastlet grant must stay credential-based" >&2
            exit 1
          fi

          # Exactly one chart owns the render: an explicit create=true must not
          # double the fixed-name objects, and create=false must stay opt-out.
          # Workloads share these names, so compare RBAC objects only.
          rbac_objects() {
            awk '/^kind: (ClusterRole|ClusterRoleBinding|Role|RoleBinding|ServiceAccount)$/{k=$2}
                 /^  name: /{if(k!=""){print k" "$2; k=""}}' <<<"$1" \
              | grep -E '^(ClusterRole|ClusterRoleBinding|Role|RoleBinding|ServiceAccount) fast-sandbox-(controller|fastpath|fastlet-issuer-discovery|controller-token-minter|fastpath-token-minter)$' \
              | sort -u
          }

          explicit="$(helm template opensandbox charts/opensandbox \
            --set fast-sandbox.enabled=true --set base.fastSandbox.rbac.create=true)"
          if [ "$(rbac_objects "$enabled")" != "$(rbac_objects "$explicit")" ]; then
            echo "::error::an explicit base.fastSandbox.rbac.create=true changes the control-plane RBAC set rendered by default (duplicate or missing objects)" >&2
            exit 1
          fi

          opted_out="$(helm template opensandbox charts/opensandbox \
            --set fast-sandbox.enabled=true --set base.fastSandbox.rbac.create=false)"
          if [ -n "$(rbac_objects "$opted_out")" ]; then
            echo "::error::base.fastSandbox.rbac.create=false no longer opts out of the fast-sandbox control-plane RBAC" >&2
            exit 1
          fi

          # Standalone base releases keep rendering the RBAC by default.
          base_rendered="$(helm template base charts/base)"
          for resource in fast-sandbox-controller fast-sandbox-fastpath fast-sandbox-fastlet-issuer-discovery; do
            grep -Fq "name: $resource" <<<"$base_rendered" || {
              echo "::error::standalone base no longer renders $resource" >&2
              exit 1
            }
          done

      - name: Verify Fastlet Proxy resource arguments and legacy values
        run: |
          set -euo pipefail
          rendered="$(helm template fast-sandbox manifests/charts/fast-sandbox \
            --set controller.fastletProxy.resources.requests.cpu=125m \
            --set controller.fastletProxy.resources.requests.memory=96Mi \
            --set controller.fastletProxy.resources.limits.cpu=500m \
            --set controller.fastletProxy.resources.limits.memory=384Mi)"
          for argument in \
            --fastlet-proxy-request-cpu=125m \
            --fastlet-proxy-request-memory=96Mi \
            --fastlet-proxy-limit-cpu=500m \
            --fastlet-proxy-limit-memory=384Mi; do
            grep -Fq -- "$argument" <<<"$rendered"
          done

          legacy_rendered="$(helm template fast-sandbox manifests/charts/fast-sandbox \
            --set controller.fastletProxy=null)"
          for argument in \
            --fastlet-proxy-request-cpu=50m \
            --fastlet-proxy-request-memory=64Mi \
            --fastlet-proxy-limit-cpu=250m \
            --fastlet-proxy-limit-memory=256Mi; do
            grep -Fq -- "$argument" <<<"$legacy_rendered"
          done

      - name: Generate chart documentation
        working-directory: manifests
        run: |
          make helm-docs

      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain -- manifests/charts)" ]; then
            echo "::error::Helm chart documentation is out of date. Run 'make helm-docs' in manifests/ and commit the generated README.md files."
            git diff -- manifests/charts
            exit 1
          fi
          echo "Chart documentation is up to date."
