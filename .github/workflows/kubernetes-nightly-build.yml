name: Kubernetes nightly build (Monorepo)

permissions:
  contents: read
  pull-requests: read
  packages: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      area: kubernetes-mini-e2e

  # Full Kubernetes version sweep for the controller core e2e suite.
  # PRs only run the boundary versions in kubernetes-test.yml; this job keeps
  # every supported version covered nightly.
  controller-e2e-core-matrix:
    name: Controller E2E Core Full Matrix (Kubernetes v${{ matrix.version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        version: ["1.22.4", "1.24.4", "1.26.4", "1.28.6", "1.30.4", "1.32.2", "1.34.2"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: kubernetes/go.sum

      - name: Run core e2e tests
        working-directory: kubernetes
        run: |
          make test-e2e-core KIND_K8S_VERSION=v${{ matrix.version }}

  k8s-mini-e2e:
    name: Kubernetes mini E2E (${{ matrix.variant }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: direct
            script: scripts/python-k8s-e2e.sh
            e2e_gateway_route_mode: ""
            # Shipped-default topology leg: the production server default is
            # execd_run_as_init = false, so one K8s leg stays on the non-init
            # path while init mode soaks elsewhere.
            execd_run_as_init: "false"
          - variant: ingress-header
            script: scripts/python-k8s-e2e-ingress.sh
            e2e_gateway_route_mode: ""
            execd_run_as_init: "true"
          - variant: ingress-uri
            script: scripts/python-k8s-e2e-ingress.sh
            e2e_gateway_route_mode: uri
            execd_run_as_init: "true"
    env:
      KIND_CLUSTER: opensandbox-e2e
      KIND_K8S_VERSION: v1.30.4
      KUBECONFIG_PATH: /tmp/opensandbox-kind-kubeconfig
      KUBECONFIG: /tmp/opensandbox-kind-kubeconfig
      OPENSANDBOX_E2E_SANDBOX_CPU: 250m
      OPENSANDBOX_E2E_SANDBOX_MEMORY: 512Mi
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache-dependency-path: kubernetes/go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Kubernetes runtime E2E
        env:
          E2E_GATEWAY_ROUTE_MODE: ${{ matrix.e2e_gateway_route_mode }}
          E2E_EXECD_RUN_AS_INIT: ${{ matrix.execd_run_as_init }}
        run: bash "./${{ matrix.script }}"

      - name: Dump kind diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get batchsandboxes -A || true
          kubectl get pv,pvc -A || true
          kubectl describe deployment -n opensandbox-system opensandbox-controller-manager || true
          kubectl describe deployment -n opensandbox-system opensandbox-server || true
          kubectl get svc -n opensandbox-system opensandbox-server || true

      - name: Eval in-cluster server logs
        if: always()
        run: |
          kubectl logs -n opensandbox-system deployment/opensandbox-server || true
          cat /tmp/opensandbox-server-port-forward.log || true

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-k8s-e2e-logs-${{ matrix.variant }}
          path: |
            /tmp/opensandbox-server-port-forward.log
            /tmp/opensandbox-ingress-gateway-port-forward.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Clean up Kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true

  execd-init-e2e:
    name: Execd-Init + Hardening E2E
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER: opensandbox-e2e
      KIND_K8S_VERSION: v1.30.4
      KUBECONFIG_PATH: /tmp/opensandbox-kind-kubeconfig
      KUBECONFIG: /tmp/opensandbox-kind-kubeconfig
      OPENSANDBOX_E2E_SANDBOX_CPU: 250m
      OPENSANDBOX_E2E_SANDBOX_MEMORY: 512Mi
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache-dependency-path: kubernetes/go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run execd-init + hardening E2E
        run: bash scripts/python-k8s-execd-init-e2e.sh

      - name: Dump kind diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get batchsandboxes -A || true
          kubectl describe deployment -n opensandbox-system opensandbox-server || true

      - name: Eval in-cluster server logs
        if: always()
        run: |
          kubectl logs -n opensandbox-system deployment/opensandbox-server || true
          cat /tmp/opensandbox-server-port-forward.log || true

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execd-init-e2e-logs
          path: |
            /tmp/opensandbox-server-port-forward.log
            /tmp/opensandbox-e2e-pods.yaml
            /tmp/opensandbox-e2e-batchsandboxes.yaml
          if-no-files-found: ignore
          retention-days: 5

      - name: Clean up Kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true

  k8s-pool-e2e:
    name: Kubernetes Pool E2E (ingress-header)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER: opensandbox-e2e
      KIND_K8S_VERSION: v1.30.4
      KUBECONFIG_PATH: /tmp/opensandbox-kind-kubeconfig
      KUBECONFIG: /tmp/opensandbox-kind-kubeconfig
      OPENSANDBOX_E2E_SANDBOX_CPU: 250m
      OPENSANDBOX_E2E_SANDBOX_MEMORY: 512Mi
      E2E_TEST_SUITE: pool
      E2E_GATEWAY_ROUTE_MODE: ""
      # Catch event-loop cross-thread misuse in the pool warmup loop.
      PYTHONASYNCIODEBUG: "1"
      # Lifecycle-stress test round count (tests/python POOL_STRESS_ROUNDS).
      # Keep this within what a single-node Kind on a 4-core runner can
      # sustain: higher round counts saturate the node with Pending sandbox
      # pods, and every failed create blocks the server for 180s
      # (POD_READY_TIMEOUT), cascading into recovery-assertion timeouts.
      POOL_STRESS_ROUNDS: "3"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache-dependency-path: kubernetes/go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Kubernetes Pool E2E
        run: bash scripts/python-k8s-e2e-ingress.sh

      - name: Dump kind diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get batchsandboxes -A || true
          kubectl get pools -A || true
          kubectl get pv,pvc -A || true
          kubectl describe deployment -n opensandbox-system opensandbox-controller-manager || true
          kubectl describe deployment -n opensandbox-system opensandbox-server || true
          kubectl get svc -n opensandbox-system opensandbox-server || true

      - name: Eval in-cluster server logs
        if: always()
        run: |
          kubectl logs -n opensandbox-system deployment/opensandbox-server || true
          cat /tmp/opensandbox-server-port-forward.log || true

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-k8s-pool-e2e-logs
          path: |
            /tmp/opensandbox-server-port-forward.log
            /tmp/opensandbox-ingress-gateway-port-forward.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Clean up Kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true

  # Full-stack nightly check for node-agent log collection: controller + server
  # + node-agent (file sink) deployed on Kind, then a real sandbox created
  # through the server is used to verify the agent collects the sandbox
  # container stdout and finalizes the stream after the sandbox is deleted.
  nodeagent-k8s-log-collection-e2e:
    name: Node Agent K8s Log Collection E2E
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_CLUSTER: opensandbox-e2e
      KIND_K8S_VERSION: v1.30.4
      KUBECONFIG_PATH: /tmp/opensandbox-kind-kubeconfig
      KUBECONFIG: /tmp/opensandbox-kind-kubeconfig
      OPENSANDBOX_E2E_SANDBOX_CPU: 250m
      OPENSANDBOX_E2E_SANDBOX_MEMORY: 512Mi
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache-dependency-path: kubernetes/go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run node-agent full-stack log collection E2E
        run: bash scripts/nodeagent-k8s-smoke.sh

      - name: Dump kind diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get batchsandboxes -A || true
          kubectl logs -n opensandbox-system -l app.kubernetes.io/component=node-agent --all-containers --tail=-1 || true

      - name: Clean up Kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true

  # Full fast-sandbox stack (OSEP-0024 idle-pause profile included);
  # nightly/dispatch only, KVM runner.
  fast-sandbox-full-stack:
    name: Fast Sandbox Full-Stack E2E (KVM)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: kvm
    timeout-minutes: 180
    env:
      # Covers up, both e2e steps, and the failure diagnostics.
      IDLE_PAUSE: "1"
    steps:
      # actions/checkout always executes as the runner user; the script
      # steps below run as root and leave root-owned files (venv, pycache)
      # in the workspace, so hand ownership back before every checkout.
      - name: Reset workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run integration tests (idle-pause profile)
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh up --auto-clean

      - name: Run native template verify
        timeout-minutes: 75
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh verify-native

      - name: Run overlaybd template verify
        # Builds the overlaybd template first; no-op when OCI_STACK=0.
        timeout-minutes: 90
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh verify-overlaybd

      - name: Run base SDK e2e
        timeout-minutes: 30
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh sdk-e2e

      - name: Run idle-pause SDK e2e
        timeout-minutes: 45
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh idle-e2e

      # Collect the env's own failure dump ($WORK/logs/failure-*.txt) plus
      # live status, BEFORE teardown removes the cluster.
      - name: Collect failure diagnostics
        if: failure()
        run: |
          work="/data/fast-sandbox-env"; [ -d "$work" ] || work="$PWD/.fast-sandbox-env"
          mkdir -p diagnostics
          sudo cp -a "$work/logs" "$work/run.log" diagnostics/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" diagnostics || true
          sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh status \
            > diagnostics/live-status.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-sandbox-full-stack-diagnostics-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 7

      - name: Teardown
        if: always()
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh down

  publish-nightly-latest:
    name: Publish latest (${{ matrix.component }} nightly)
    needs: [k8s-mini-e2e, k8s-pool-e2e, execd-init-e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: execd
            workdir: components/execd
          - component: ingress
            workdir: components/ingress
          - component: egress
            workdir: components/egress
          - component: controller
            workdir: kubernetes
            k8s_component: controller
          - component: task-executor
            workdir: kubernetes
            k8s_component: task-executor
          - component: server
            workdir: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (TAG=latest)
        working-directory: ${{ matrix.workdir }}
        run: |
          export TAG=latest
          export GHCR_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opensandbox"
          if [ -n "${{ matrix.k8s_component }}" ]; then
            export COMPONENT="${{ matrix.k8s_component }}"
          fi
          chmod +x build.sh
          ./build.sh

  required:
    name: Kubernetes Mini E2E CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, k8s-mini-e2e, k8s-pool-e2e, execd-init-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RESULT: ${{ needs.k8s-mini-e2e.result }}
          POOL_E2E_RESULT: ${{ needs.k8s-pool-e2e.result }}
          EXECD_INIT_RESULT: ${{ needs.execd-init-e2e.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$RELEVANT" == "true" ]]; then
            [[ "$E2E_RESULT" == "success" && "$POOL_E2E_RESULT" == "success" && "$EXECD_INIT_RESULT" == "success" ]]
          else
            [[ "$RELEVANT" == "false" && "$E2E_RESULT" == "skipped" && "$POOL_E2E_RESULT" == "skipped" && "$EXECD_INIT_RESULT" == "skipped" ]]
          fi
