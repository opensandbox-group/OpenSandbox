name: Fast Sandbox State Root Tests

on:
  pull_request:
    paths:
      - 'scripts/fast-sandbox-state-root-setup.sh'
      - 'scripts/tests/test_fast_sandbox_state_root_setup.py'
      - '.github/workflows/fast-sandbox-state-root-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fast-sandbox-state-root-setup.sh'
      - 'scripts/tests/test_fast_sandbox_state_root_setup.py'
      - '.github/workflows/fast-sandbox-state-root-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check shell script
        run: shellcheck scripts/fast-sandbox-state-root-setup.sh
      - name: Test safeguards and provisioning with stubbed disk commands
        run: sudo python3 -m unittest discover -s scripts/tests -p test_fast_sandbox_state_root_setup.py -v
