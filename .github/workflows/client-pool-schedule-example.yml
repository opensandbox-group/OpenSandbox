name: Client Pool Schedule Example

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/client-pool-schedule/**"
      - "sdks/sandbox/go/**"
      - ".github/workflows/client-pool-schedule-example.yml"
  push:
    branches: [main]
    paths:
      - "examples/client-pool-schedule/**"
      - "sdks/sandbox/go/**"
      - ".github/workflows/client-pool-schedule-example.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.20"
          cache-dependency-path: examples/client-pool-schedule/go.sum
      - name: Check example against the local SDK
        working-directory: examples/client-pool-schedule
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
