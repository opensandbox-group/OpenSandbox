name: Fast Sandbox Integration Tests

on:
  workflow_dispatch:
    inputs:
      fsb_commit:
        description: Optional fast-sandbox commit SHA to test instead of the pinned commit (full 40-char SHA; a PR head SHA works)
        required: false
        type: string
  repository_dispatch:
    types: [fast-sandbox-pr]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  actions: write

# Unique group per dispatch run (GitHub concurrency would otherwise fold
# queued runs away); PR pushes keep superseding each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      area: fast-sandbox

  integration:
    name: Integration Env (self-hosted kvm)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: kvm
    timeout-minutes: 240
    env:
      # Full-stack profile (single round while scenarios stabilize).
      IDLE_PAUSE: "1"
      IDLE_PAUSE_ROUNDS: "1"
      # workflow_dispatch input or repository_dispatch client_payload (empty on PRs).
      FSB_COMMIT_OVERRIDE: ${{ inputs.fsb_commit || github.event.client_payload.fsb_commit }}
    steps:
      # actions/checkout always executes as the runner user; the script
      # steps below run as root and leave root-owned files (venv, pycache)
      # in the workspace, so hand ownership back before every checkout.
      - name: Reset workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Test integration script failure handling
        # The self-hosted runner's system python3 may still be Python 3.6.
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/tests -p test_fast_sandbox_integration_env.py -v

      # Rewrites the pin in the working tree only, then re-vendors the CRD
      # bundle so the charts install the tested commit's CRDs.
      - name: Override fast-sandbox pin
        if: env.FSB_COMMIT_OVERRIDE != ''
        run: |
          [[ "$FSB_COMMIT_OVERRIDE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::fsb_commit must be a full 40-character SHA (got: $FSB_COMMIT_OVERRIDE)"
            exit 1
          }
          echo "Testing fast-sandbox @ $FSB_COMMIT_OVERRIDE instead of the pinned commit"
          sed -i "s/^commit:.*/commit: $FSB_COMMIT_OVERRIDE/" manifests/third-party/fast-sandbox.commit
          manifests/release/build-fast-sandbox.sh --no-build --sync-crds

      - name: Run integration tests (environment init)
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh up --auto-clean

      - name: Run native template verify
        timeout-minutes: 75
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh verify-native

      - name: Run overlaybd template verify
        # Builds the overlaybd template first; no-op when OCI_STACK=0.
        timeout-minutes: 90
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh verify-overlaybd

      - name: Run base SDK e2e
        # Runs on the overlaybd template (native only under OCI_STACK=0).
        timeout-minutes: 60
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh sdk-e2e

      - name: Run idle-pause SDK e2e
        timeout-minutes: 45
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh idle-e2e

      # Collect the env's own failure dump ($WORK/logs/failure-*.txt: kind
      # nodes/pods, controller / firecracker-runtime / fastlet / builder /
      # server / gateway / RustFS log tails, SandboxTemplates, SandboxPool,
      # events) plus live status, BEFORE teardown removes the cluster.
      - name: Collect failure diagnostics
        if: failure()
        run: |
          work="/data/fast-sandbox-env"; [ -d "$work" ] || work="$PWD/.fast-sandbox-env"
          mkdir -p diagnostics
          sudo cp -a "$work/logs" "$work/run.log" diagnostics/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" diagnostics || true
          sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh status \
            > diagnostics/live-status.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-sandbox-diagnostics-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 7

      - name: Teardown
        if: always()
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh down
