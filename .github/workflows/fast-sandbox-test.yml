name: Fast Sandbox Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      area: fast-sandbox

  integration:
    name: Integration Env (self-hosted kvm)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [self-hosted, kvm]
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run integration tests
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh up --auto-clean

      - name: Run SDK e2e
        timeout-minutes: 30
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh sdk-e2e

      - name: Fix workspace ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" /data/fast-sandbox-env 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" .fast-sandbox-env 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-sandbox-env-logs
          path: |
            /data/fast-sandbox-env/logs/
            .fast-sandbox-env/logs/
          retention-days: 5
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: sudo -E env "PATH=$PATH" ./scripts/fast-sandbox-env/integration-env.sh down
