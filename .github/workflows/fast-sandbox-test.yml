name: Fast Sandbox Integration Tests

on:
  workflow_dispatch:
    inputs:
      fsb_commit:
        description: Optional fast-sandbox commit SHA to test instead of the pinned commit (full 40-char SHA; a PR head SHA works)
        required: false
        type: string
      verify_disk_hotplug:
        description: Test native-template PCI disk hotplug and exec session continuity (requires a PCI-capable fast-sandbox commit)
        type: boolean
        default: false
      pool_mode:
        description: SandboxPool profile (resource-aware | legacy)
        required: false
        type: string
        default: resource-aware
      egress_modes:
        description: Comma-separated egress modes (default, all, credential-bound); PRs run default + all
        required: false
        type: string
        default: default
      bench:
        description: Also run the OSEP-0023 cost bench in each requested mode (PRs opt in with the fast-sandbox-bench label)
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [fast-sandbox-pr]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read
  actions: write

# PR pushes supersede each other. Dispatch runs key on client_payload.pr so a
# new push to the same fast-sandbox PR cancels the in-flight KVM run (its
# dispatcher is already gone); no pr -> unique group per run. Unrelated
# `labeled` events get their own group: the job gate skips them anyway, and a
# shared group would let cancel-in-progress kill an in-flight KVM run before
# the gate gets a chance to skip.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ok-to-test' && (github.event.label.name != 'test-disk-hotplug' || !contains(github.event.pull_request.labels.*.name, 'ok-to-test'))) && format('{0}-label-noise', github.event.pull_request.number) || github.event.pull_request.number || (github.event_name == 'repository_dispatch' && github.event.client_payload.pr != '' && format('fsb-pr-{0}', github.event.client_payload.pr)) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'repository_dispatch' && github.event.client_payload.pr != '') }}

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      area: fast-sandbox

  verifier-tests:
    name: Credential-bound verifier tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Shared by the prerequisite guard and all golden comparisons. Bump in
      # lockstep with GOLDEN_BASE in scripts/fast-sandbox-env/tests/test_credential_bound.py
      # whenever a stage-list change is intentional.
      CBV_GOLDEN_BASE: 02be68b5fde9c74d69f5ba69a2dbb97c76f23c06
    steps:
      - uses: actions/checkout@v6
        with:
          # Golden render/stage tests compare against the pre-change commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Verify local test prerequisites
        # Fail instead of letting the golden/YAML/TLS/proc tests skip.
        run: |
          bash -c 'test "${BASH_VERSINFO[0]}" -ge 4'
          python -c 'import yaml'
          command -v jq
          command -v openssl
          test -d /proc/self
          git cat-file -e "${CBV_GOLDEN_BASE}^{commit}" || {
            echo "::error::golden baseline commit ${CBV_GOLDEN_BASE} not present; check CBV_GOLDEN_BASE and fetch history"
            exit 1
          }
      - name: Run verifier regression tests
        run: python -m unittest discover -v -s scripts/fast-sandbox-env/tests -p 'test_*.py'

  # One KVM environment: default credential-bound first, explicit all in-place.
  # An explicit credential-bound dispatch still runs the full initial leg.
  egress-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.modes.outputs.matrix }}
      run_all_delta: ${{ steps.modes.outputs.run_all_delta }}
    steps:
      - id: modes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.egress_modes || github.event.client_payload.egress_modes || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          values = {"default": "", "all": "all", "credential-bound": "credential-bound"}
          requested = os.environ["REQUESTED"]
          if os.environ["EVENT_NAME"] == "pull_request":
              requested = "default,all"
          modes = []
          for part in (p.strip() for p in requested.split(",")):
              if not part:
                  continue
              if part not in values:
                  print(f"::error::unknown egress mode '{part}' (valid: {', '.join(values)})")
                  sys.exit(1)
              if values[part] not in modes:
                  modes.append(values[part])
          if not modes:
              modes = [""]
          # Default and explicit credential-bound share runtime semantics.
          # Prefer unset to test the real default; reuse this environment for all.
          bound = "" if "" in modes else "credential-bound"
          has_bound = any(mode != "all" for mode in modes)
          matrix = [bound] if has_bound else ["all"]
          run_all_delta = "true" if has_bound and "all" in modes else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"run_all_delta={run_all_delta}\n")
          PY

  integration:
    # The default leg keeps the original check name; the OSEP-0023 leg adds
    # its mode to the name.
    name: Integration Env (self-hosted kvm${{ matrix.egress_interception_mode != '' && format(', {0}', matrix.egress_interception_mode) || '' }})
    needs: [changes, egress-modes]
    if: >-
      github.event_name != 'pull_request' ||
      ( needs.changes.outputs.relevant == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'ok-to-test') &&
      ( github.event.action != 'labeled' ||
      github.event.label.name == 'ok-to-test' ||
      github.event.label.name == 'test-disk-hotplug' ) )
    # The initial leg renders the switch unset for default coverage; the all
    # delta drains sandboxes and recreates only the Pool on the same KVM host.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        egress_interception_mode: ${{ fromJSON(needs.egress-modes.outputs.matrix) }}
    uses: ./.github/workflows/fast-sandbox-e2e.yml
    with:
      # OSEP-0026: the integration lane exercises the ResourceAware pool by
      # default; LegacySlot regression lives in the nightly full-stack run.
      pool_mode: ${{ inputs.pool_mode || github.event.client_payload.pool_mode || 'resource-aware' }}
      egress_interception_mode: ${{ matrix.egress_interception_mode }}
      run_all_delta: ${{ needs.egress-modes.outputs.run_all_delta == 'true' }}
      fsb_commit_override: ${{ inputs.fsb_commit || github.event.client_payload.fsb_commit || '' }}
      verify_disk_hotplug: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_disk_hotplug) || (github.event_name == 'pull_request' && matrix.egress_interception_mode == '' && contains(github.event.pull_request.labels.*.name, 'test-disk-hotplug')) }}
      bench: ${{ (github.event_name == 'workflow_dispatch' && inputs.bench) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fast-sandbox-bench')) }}
      idle_pause_rounds: "1"
      artifact_prefix: fast-sandbox-diagnostics-${{ matrix.egress_interception_mode || 'default' }}
      timeout_minutes: 240
