name: Umbrella Release

# OSEP-0016 unified umbrella release — build-hold-publish fan-out.
#
# Phase 1 (this file): preflight, version-consistency scan, staging image
# builds, and BOM assembly/commit on the release branch. Publish-facing
# steps (image promotion to release-X.Y.Z, tags, GitHub Release) are
# gated behind dry_run=false AND the UMBRELLA_PUBLISH_ENABLED repo
# variable, which stays unset until GA.
#
# Package legs (PyPI, npm, Maven, NuGet) run through the reusable
# release-packages.yml workflow: hold-only on dry runs AND on rc
# builds; ordered verify-then-continue publish only for stable releases
# with publish gates open. Helm charts
# are not published — they ship in-repo at the release tag. The legacy
# tag-triggered publish-* workflows have been deleted; the umbrella is
# the only release path.

permissions:
  contents: write
  packages: write

on:
  schedule:
    # Weekly dry-run (OSEP-0016 test plan): exercises the fan-out so the
    # chain cannot rot between real release windows. No side effects:
    # images stay on staging tags, packages are held, no git tags.
    - cron: '0 3 * * 3'
  workflow_dispatch:
    inputs:
      version:
        description: 'Umbrella version, e.g. 1.1.0 or 1.1.0-rc.1'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publish-facing side effects)'
        required: true
        type: boolean
        default: true

jobs:
  resolve:
    name: Resolve release parameters
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.params.outputs.version }}
      channel: ${{ steps.params.outputs.channel }}
      release_branch: ${{ steps.params.outputs.release_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Resolve parameters
        id: params
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$IN_VERSION" ]]; then
            version="$IN_VERSION"
          else
            # scheduled dry-run: use the chart version carried by this ref
            version="$(sed -n 's/^version:[[:space:]]*//p' manifests/charts/opensandbox/Chart.yaml | head -1 | tr -d '"'"'"'')"
          fi
          # channel derives from the version suffix (X.Y.Z-rc.N -> rc)
          if [[ "$version" == *-* ]]; then channel="rc"; else channel="stable"; fi
          # the BOM commit lands on the branch the workflow was dispatched on
          branch="${GITHUB_REF_NAME}"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "channel=$channel"   >> "$GITHUB_OUTPUT"
          echo "release_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$version channel=$channel branch=$branch"

  preflight:
    needs: resolve
    uses: ./.github/workflows/release-preflight.yml
    with:
      require_approval: ${{ !inputs.dry_run }}

  scan:
    name: Version-consistency scan
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Scan version consistency
        run: |
          ./manifests/release/create-umbrella-release.sh \
            --version "${{ needs.resolve.outputs.version }}" \
            --scan-only \
            --skip-remote-check

  build-images:
    name: Build and stage ${{ matrix.component }} image
    needs: [resolve, preflight, scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dir: server
          - component: execd
            dir: components/execd
          - component: ingress
            dir: components/ingress
          - component: egress
            dir: components/egress
          - component: image-committer
            dir: kubernetes
          - component: controller
            dir: kubernetes
          - component: task-executor
            dir: kubernetes
          - component: nodeagent
            dir: components/nodeagent
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dry-run builds locally (PUSH=false, single-arch, --load): no
      # registry credentials are needed and nothing is pushed
      - name: Login to DockerHub
        if: inputs.dry_run == false
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to ACR
        if: inputs.dry_run == false
        uses: docker/login-action@v3
        with:
          registry: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        if: inputs.dry_run == false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build and push staging image
        id: build
        env:
          COMPONENT: ${{ matrix.component }}
          STAGING_TAG: staging-${{ github.sha }}-${{ github.run_id }}
          PUSH: ${{ inputs.dry_run == false }}
        run: |
          GHCR_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          export GHCR_REPO
          cd "${{ matrix.dir }}"
          export TAG="$STAGING_TAG"
          chmod +x build.sh
          ./build.sh

          if [ "$PUSH" = "true" ]; then
            DIGEST="$(docker buildx imagetools inspect "docker.io/opensandbox/${COMPONENT}:${STAGING_TAG}" --format '{{.Manifest.Digest}}')"
          else
            # dry-run: local image ID (config digest) as the rehearsal digest
            DIGEST="$(docker image inspect --format '{{.Id}}' "opensandbox/${COMPONENT}:${STAGING_TAG}")"
          fi
          if [[ -z "$DIGEST" ]]; then
            echo "Unable to resolve staging digest" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "staging_tag=$STAGING_TAG" >> "$GITHUB_OUTPUT"

      - name: Record digest in manifest
        run: |
          printf '{"%s": "%s"}\n' \
            "${{ matrix.component }}" \
            "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.component }}.json"

      - name: Upload digest manifest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: digest-${{ matrix.component }}.json
          retention-days: 14

  build-fast-sandbox:
    name: Build and stage fast-sandbox images
    needs: [resolve, preflight, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push staging images
        env:
          STAGING_TAG: staging-${{ github.sha }}-${{ github.run_id }}
        run: |
          GHCR_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opensandbox"
          export GHCR_REPO
          # fast-sandbox images publish under the unified opensandbox/*
          # namespace with an fsb- prefix (fsb-controller disambiguates from
          # the k8s controller image) and get the full registry mirror set.
          TAG="$STAGING_TAG" ./manifests/release/build-fast-sandbox.sh --push

      - name: Record digests in manifest
        env:
          STAGING_TAG: staging-${{ github.sha }}-${{ github.run_id }}
        run: |
          jq -n '{}' > digest-fast-sandbox.json
          for img in fsb-controller fsb-fastlet fsb-fastlet-proxy fsb-janitor fsb-firecracker-runtime fsb-sandboxtemplate-builder; do
            d="$(docker buildx imagetools inspect "docker.io/opensandbox/${img}:${STAGING_TAG}" --format '{{.Manifest.Digest}}')"
            jq --arg k "${img}" --arg v "${d}" '. + {($k): $v}' digest-fast-sandbox.json > tmp.json && mv tmp.json digest-fast-sandbox.json
          done
          cat digest-fast-sandbox.json

      - name: Upload digest manifest
        uses: actions/upload-artifact@v4
        with:
          name: digest-fast-sandbox
          path: digest-fast-sandbox.json
          retention-days: 14

  packages:
    name: SDK / CLI / server packages (hold${{ inputs.dry_run == false && vars.UMBRELLA_PUBLISH_ENABLED == 'true' && ' + publish' || '' }})
    needs: [resolve, preflight, scan]
    # the called workflow's publish leg attests held bytes — grant it
    # id-token/attestations here or the workflow fails validation
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-packages.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      channel: ${{ needs.resolve.outputs.channel }}
      # packages are published for stable releases only — rc builds hold
      # them to validate the fan-out without touching immutable registries
      #
      # TODO(GA): with rc holding packages, the publish legs (registry
      # credentials, verify-then-continue, rollback ledger) execute for
      # real only at a line's first stable release. Before opening the
      # gates for 1.1.0, rehearse the publish path end-to-end — e.g. a
      # staging-registry rehearsal mode, or a one-off gated publish of a
      # throwaway version per ecosystem — and record the result in the
      # release runbook.
      publish: ${{ inputs.dry_run == false && vars.UMBRELLA_PUBLISH_ENABLED == 'true' && needs.resolve.outputs.channel == 'stable' }}
    secrets: inherit

  bom:
    name: Assemble and commit BOM
    needs: [resolve, build-images, build-fast-sandbox]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.release_branch }}
          fetch-depth: 0

      - name: Download digest manifests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*

      - name: Merge digest manifests
        run: |
          jq -s 'add' digests/digest-*/digest-*.json > /tmp/digests.json
          cat /tmp/digests.json

      - name: Commit BOM and release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_BRANCH: ${{ needs.resolve.outputs.release_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "opensandbox-release-bot"
          git config user.email "opensandbox-release-bot@users.noreply.github.com"
          # scheduled dry-runs run on a non-bumped ref: the scan would fail
          # by design, so it is exercised on dispatch only
          SKIP=""
          [[ "$EVENT_NAME" != "schedule" ]] || SKIP="--skip-consistency"
          ./manifests/release/create-umbrella-release.sh \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --release-branch "$RELEASE_BRANCH" \
            --digests-manifest /tmp/digests.json \
            --no-tags \
            --skip-remote-check \
            $SKIP \
            --push

  # Phase 1: publish-facing steps below stay locked behind the repo
  # variable UMBRELLA_PUBLISH_ENABLED (and dry_run=false). Phase 2 adds
  # the per-ecosystem package legs before this gate is opened.
  promote:
    name: Promote images to release tag
    needs: [resolve, bom, packages]
    if: ${{ inputs.dry_run == false && vars.UMBRELLA_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to registries
        run: echo "logins are performed per-registry below"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.3

      - name: Promote staged images to release-${{ needs.resolve.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          STAGING_TAG: staging-${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          components=(server execd ingress egress image-committer controller task-executor nodeagent)
          registries=(
            "docker.io/opensandbox"
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opensandbox"
            "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox"
          )
          for comp in "${components[@]}"; do
            for reg in "${registries[@]}"; do
              crane tag "${reg}/${comp}:${STAGING_TAG}" "release-${VERSION}"
              echo "promoted ${reg}/${comp}:${STAGING_TAG} -> release-${VERSION}"
            done
          done
          # fast-sandbox family (same namespace + mirror set as components)
          fs_images=(fsb-controller fsb-fastlet fsb-fastlet-proxy fsb-janitor fsb-firecracker-runtime fsb-sandboxtemplate-builder)
          for img in "${fs_images[@]}"; do
            for reg in "${registries[@]}"; do
              crane tag "${reg}/${img}:${STAGING_TAG}" "release-${VERSION}"
              echo "promoted ${reg}/${img}:${STAGING_TAG} -> release-${VERSION}"
            done
          done

  release:
    name: Mint tags and publish GitHub Release
    needs: [resolve, promote, packages]
    if: ${{ inputs.dry_run == false && vars.UMBRELLA_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.release_branch }}
          fetch-depth: 0

      - name: Mint umbrella and Go companion tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          git config user.name "opensandbox-release-bot"
          git config user.email "opensandbox-release-bot@users.noreply.github.com"
          git tag -a "release-${VERSION}" -m "release: OpenSandbox ${VERSION}" -m "Umbrella release built from ${GITHUB_SHA}."
          # rc releases ship no SDK artifacts, so no companion tag either
          if [ "$CHANNEL" = "stable" ]; then
            git tag -a "sdks/sandbox/go/v${VERSION}" -m "release: OpenSandbox Go SDK ${VERSION}" -m "Companion tag for the umbrella release-${VERSION} (same commit)."
            git push origin "release-${VERSION}" "sdks/sandbox/go/v${VERSION}"
          else
            git push origin "release-${VERSION}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          [ "${{ needs.resolve.outputs.channel }}" = "rc" ] && PRERELEASE="--prerelease"
          gh release create "release-${VERSION}" \
            --verify-tag $PRERELEASE \
            --title "OpenSandbox ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md" \
            "docs/releases/${VERSION}.yaml"
