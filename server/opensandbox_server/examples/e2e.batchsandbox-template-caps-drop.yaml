# E2E-only BatchSandbox template variant with a reduced capability ceiling:
# identical to e2e.batchsandbox-template.yaml plus capabilities.drop
# [SETPCAP, NET_RAW] on the sandbox container, so the hardening e2e can
# exercise cap_drop degradation and the keep-caps-ceiling conflict on k8s.
# Selected per leg via E2E_BATCHSANDBOX_TEMPLATE_FILE
# (scripts/python-k8s-execd-init-e2e.sh). Skips the 30s graceful termination
# window for faster Kind/CI teardown — not for real workloads.
#
# The optional execd-isolation ConfigMap (created by
# scripts/python-k8s-execd-init-e2e.sh) carries the hardened isolation TOML;
# execd only reads it when EXECD_ISOLATION_CONFIG points at it.

# Metadata template (will be merged with runtime-generated metadata)
metadata:
# Spec template
spec:
  replicas: 1
  template:
    spec:
      terminationGracePeriodSeconds: 0
      restartPolicy: Never
      tolerations:
        - operator: "Exists"
      volumes:
        - name: execd-isolation
          configMap:
            name: opensandbox-e2e-execd-isolation
            optional: true
      containers:
        - name: sandbox
          securityContext:
            capabilities:
              drop:
                - SETPCAP
                - NET_RAW
          volumeMounts:
            - name: execd-isolation
              mountPath: /etc/opensandbox/execd-isolation
              readOnly: true
