# Agent Substrate POC configuration. Administrators must create the Atespace,
# ActorTemplate, WorkerPool, SandboxConfig, snapshot storage, and atenet first.

[server]
host = "0.0.0.0"
port = 8080
api_key = "replace-me"

[runtime]
type = "kubernetes"
execd_image = "unused-for-agent-substrate"

[kubernetes]
namespace = "opensandbox-system"
workload_provider = "agent-substrate"

[agent_substrate]
upstream_revision = "c1ab0958f85202faf9f87ea66cd98903a9de763b"
api_endpoint = "api.ate-system.svc:443"
router_endpoint = "http://atenet-router.ate-system.svc:80"
ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
server_name = "api.ate-system.svc"
default_atespace = "opensandbox"
rpc_timeout_seconds = 20

# Uncomment when ateapi uses JWT auth.
# token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

[[agent_substrate.templates]]
key = "python"
namespace = "opensandbox-templates"
name = "python-execd"
logical_port = 44772
actor_port = 80