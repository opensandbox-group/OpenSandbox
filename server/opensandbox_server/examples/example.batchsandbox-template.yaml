# Example BatchSandbox CR template for OpenSandbox Kubernetes runtime
# This is a complete BatchSandbox CR template that will be merged with runtime values
#
# Usage in config.toml:
#   [kubernetes]
#   batchsandbox_template_file = "/path/to/this/file.yaml"

# Metadata template (will be merged with runtime-generated metadata)
metadata:
# Spec template
spec:
  replicas: 1
  # Pod template specification
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - operator: "Exists"
      # Pod-level volumes and per-container volumeMounts declared here are merged
      # into every sandbox pod. Template containers are matched to pod containers
      # by name, so the entry below adds a mount to the egress sidecar — for
      # example to supply always-rules from a ConfigMap instead of a custom image.
      # volumes:
      #   - name: egress-rules
      #     configMap:
      #       name: opensandbox-egress-rules
      # containers:
      #   - name: egress
      #     volumeMounts:
      #       - name: egress-rules
      #         mountPath: /var/egress/rules
      #         readOnly: true
