openapi: 3.1.0
info:
  title: OpenSandbox Egress API
  version: 0.1.0
  description: |
    The OpenSandbox Egress API exposes the runtime policy interface served by the
    egress sidecar inside a sandbox. Unlike the lifecycle API, these operations are
    performed by connecting to a sandbox endpoint for the egress port and calling
    the sidecar directly.

    This API is intended for runtime inspection and mutation of outbound network
    policy after sandbox creation. Initial egress policy configuration during sandbox
    provisioning remains part of the Sandbox Lifecycle API create request.

    ## Access Model

    Clients typically access this API in two steps:

    1. Use the Sandbox Lifecycle API to resolve the sandbox endpoint for the egress
       service port.
    2. Send requests directly to that endpoint's `/policy` or
       `/credential-vault` route.

    ## Authentication

    The sidecar may optionally require the `OPENSANDBOX-EGRESS-AUTH` header. When
    the sandbox endpoint resolver returns required headers, clients must forward
    them on every egress API request.
servers:
  - url: http://localhost:18080
    description: Local egress sidecar
tags:
  - name: Policy
    description: Inspect and mutate sandbox egress policy at runtime
  - name: CredentialVault
    description: Manage sandbox-local Credential Vault bindings at runtime
paths:
  /policy:
    get:
      tags: [Policy]
      summary: Get current egress policy
      description: |
        Returns the currently enforced egress policy and the sidecar's derived
        runtime mode metadata.
      responses:
        '200':
          description: Current policy returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStatusResponse'
              examples:
                deny-with-allowlist:
                  summary: Current deny-by-default policy
                  value:
                    status: ok
                    mode: deny_all
                    enforcementMode: dns
                    policy:
                      defaultAction: deny
                      egress:
                        - action: allow
                          target: pypi.org
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Policy]
      summary: Patch egress rules
      description: |
        Merge incoming egress rules with the currently enforced policy.

        This endpoint uses merge semantics:
        - Existing rules remain unless overridden by incoming rules.
        - Incoming rules are applied with higher priority than existing rules.
        - If multiple incoming rules resolve to the same match scope (same
          `target` and the same set of `ports`), the first one wins; rules
          that differ in `target` or in `ports` coexist.
      parameters:
        - name: dropEstablished
          in: query
          required: false
          description: |
            When true, destinations removed by this policy change lose their
            established/related conntrack bypass on the dns+nft sidecar: matching
            keep-alive flows are dropped. Opt-in because tearing down long-lived
            connections can surprise callers that only meant to block new dials.
            The teardown rules stay installed across later policy applies until
            the destination is allowed again.

            Unsupported configurations return `501 Not Implemented` without
            changing the policy: `dns`-only enforcement (no nftables chain), the
            experimental revision runtime, and an upstream proxy
            (`OPENSANDBOX_EGRESS_UPSTREAM_PROXY`) combined with transparent MITM.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/NetworkRule'
            examples:
              duplicate-target-first-wins:
                summary: First rule wins for duplicate target within the same patch payload
                value:
                  - action: allow
                    target: example.com
                  - action: deny
                    target: example.com
      responses:
        '200':
          description: |
            Patch applied successfully. With the internal experimental revision
            runtime enabled, success follows optional policy-file persistence,
            nft application, exact receiver confirmation and local policy
            publication. It does not wait for the default 30-second old-request
            drain or promise atomic visibility before confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStatusResponse'
              examples:
                patched:
                  summary: Patch applied
                  value:
                    status: ok
                    mode: deny_all
                    enforcementMode: dns
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/DropEstablishedNotImplemented'
        '503':
          description: |
            The internal experimental revision runtime is unavailable, the
            mutation outcome could not be confirmed, or sticky recovery is
            required. This response does not prove that external effects were
            rolled back or that packets are isolated. No policy epoch is
            exposed by this API.
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [Policy]
      summary: Delete egress rules
      description: |
        Remove specific egress rules from the currently enforced policy by target.

        - Accepts a list of target strings (FQDNs, wildcard domains, IPs, or
          CIDRs).
        - Matching rules are removed; targets not found in the current policy
          are silently ignored (idempotent).
        - An explicit empty string ("") addresses port-only rules (rules with
          `ports` and no `target`): listing it removes every port-only rule.
          Port-only rules cannot be addressed individually by target since
          they have none.
      parameters:
        - name: dropEstablished
          in: query
          required: false
          description: |
            When true, destinations removed by this policy change lose their
            established/related conntrack bypass on the dns+nft sidecar: matching
            keep-alive flows are dropped. Opt-in because tearing down long-lived
            connections can surprise callers that only meant to block new dials.
            The teardown rules stay installed across later policy applies until
            the destination is allowed again.

            Unsupported configurations return `501 Not Implemented` without
            changing the policy: `dns`-only enforcement (no nftables chain), the
            experimental revision runtime, and an upstream proxy
            (`OPENSANDBOX_EGRESS_UPSTREAM_PROXY`) combined with transparent MITM.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                type: string
                description: FQDN or wildcard domain to remove from the policy.
              example:
                - bad.example.com
                - "*.blocked.org"
      responses:
        '200':
          description: |
            Rules removed successfully, or no matching rules were found. With
            the internal experimental revision runtime enabled, an applied
            change is confirmed by the receiver after optional policy-file
            persistence and nft application, before local policy publication
            and success. It does not wait for the default 30-second old-request
            drain or promise atomic visibility before confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStatusResponse'
              examples:
                removed:
                  summary: Rules removed
                  value:
                    status: ok
                    mode: deny_all
                    enforcementMode: dns
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/DropEstablishedNotImplemented'
        '503':
          description: |
            The internal experimental revision runtime is unavailable, the
            mutation outcome could not be confirmed, or sticky recovery is
            required. This response does not prove that external effects were
            rolled back or that packets are isolated. No policy epoch is
            exposed by this API.
          content:
            text/plain:
              schema:
                type: string
  /credential-vault:
    post:
      tags: [CredentialVault]
      summary: Create a sandbox-local Credential Vault
      description: |
        Create the initial sandbox-local Credential Vault revision and activate it
        in Credential Proxy. Inline credential values are write-only and are never
        returned by this API. The sidecar must run in `dns+nft` mode and requires
        an egress policy. `defaultAction: deny` is strongly recommended;
        default-allow remains temporarily supported with a security warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialVaultCreateRequest'
      responses:
        '201':
          description: Credential Vault created and acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVaultState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    get:
      tags: [CredentialVault]
      summary: Get sanitized Credential Vault state
      responses:
        '200':
          description: Sanitized Credential Vault state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVaultState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [CredentialVault]
      summary: Atomically mutate sandbox-local credentials and bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialVaultMutationRequest'
      responses:
        '200':
          description: Mutation applied and acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVaultState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags: [CredentialVault]
      summary: Delete the sandbox-local Credential Vault
      responses:
        '204':
          description: Credential Vault deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credential-vault/credentials:
    get:
      tags: [CredentialVault]
      summary: List sanitized credential metadata
      responses:
        '200':
          description: Sanitized credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credential-vault/credentials/{credential_name}:
    get:
      tags: [CredentialVault]
      summary: Get sanitized metadata for one credential
      parameters:
        - name: credential_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sanitized credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credential-vault/bindings:
    get:
      tags: [CredentialVault]
      summary: List sanitized credential binding metadata
      responses:
        '200':
          description: Sanitized binding metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialBindingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credential-vault/bindings/{binding_name}:
    get:
      tags: [CredentialVault]
      summary: Get sanitized metadata for one binding
      parameters:
        - name: binding_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sanitized binding metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialBindingMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: The request was invalid or malformed.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Authentication failed for the egress sidecar.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: The requested Credential Vault resource was not found.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: The request conflicts with the current Credential Vault revision.
      content:
        text/plain:
          schema:
            type: string
    DropEstablishedNotImplemented:
      description: |
        `dropEstablished=true` was requested but this sidecar cannot honor it
        (`dns`-only enforcement, the experimental revision runtime, or an
        upstream proxy with transparent MITM). The policy was not changed.
      content:
        text/plain:
          schema:
            type: string
    PreconditionFailed:
      description: Credential Proxy prerequisites are not ready.
      content:
        text/plain:
          schema:
            type: string
    InternalServerError:
      description: The sidecar failed to apply or fetch policy state.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    PolicyStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: Operation status reported by the sidecar.
          example: ok
        mode:
          type: string
          description: Derived runtime mode for the current policy.
          example: deny_all
        enforcementMode:
          type: string
          description: Egress sidecar enforcement backend mode.
          example: dns
        reason:
          type: string
          description: Optional human-readable reason when the sidecar returns extra context.
        policy:
          $ref: '#/components/schemas/NetworkPolicy'
        droppedEstablished:
          type: integer
          minimum: 0
          description: |
            Present when the request set `dropEstablished=true`. Best-effort count of
            TCP conntrack flows whose original destination matched destinations the
            new policy no longer allows. The sidecar also installs nft drop rules
            ahead of `ct state established,related accept` for those destinations.
      additionalProperties: false
    NetworkPolicy:
      type: object
      description: |
        Egress network policy matching the sidecar `/policy` request body.
        If `defaultAction` is omitted, the sidecar defaults to "deny"; passing an empty
        object or null results in allow-all behavior at startup.
      properties:
        defaultAction:
          type: string
          enum: [allow, deny]
          description: Default action when no egress rule matches. Defaults to "deny".
        egress:
          type: array
          description: List of egress rules evaluated in order.
          items:
            $ref: '#/components/schemas/NetworkRule'
      additionalProperties: false
    NetworkRule:
      type: object
      description: >-
        Egress rule. At least one of `target` or `ports` must be provided;
        when both are present the rule applies to `ports` on `target` only.
        Enforced by the server and the egress sidecar.
      properties:
        action:
          type: string
          enum: [allow, deny]
          description: Whether to allow or deny matching targets.
        target:
          type: string
          description: |
            FQDN, wildcard domain (e.g., "example.com", "*.example.com"), IP
            address, or CIDR. May be omitted when `ports` is set (see below);
            otherwise required.
        ports:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 65535
          description: |
            Restricts this rule to specific TCP destination ports.

            - `target` omitted, `ports` set: the rule applies to these ports
              across all IPv4/IPv6 destinations.
            - `target` is an IP or CIDR, `ports` set: the rule applies to that
              destination only on these ports.
            - `target` is a domain: `ports` is rejected with a validation
              error. Domain rules are evaluated at the DNS layer, which has no
              port dimension; combining them is not supported yet.

            TCP only for now; UDP port scoping is not supported.

            Under `defaultAction: deny`, the DNS proxy still denies hostname
            lookups for targetless allow rules (it matches domain rules
            only), so this shape serves direct-IP clients; hostname access
            requires explicit domain rules or stable IPs.
      required: [action]
      additionalProperties: false
    CredentialVaultCreateRequest:
      type: object
      required: [credentials, bindings]
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/CredentialBinding'
      additionalProperties: false
    CredentialVaultMutationRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          description: Optional optimistic concurrency guard.
        credentials:
          $ref: '#/components/schemas/CredentialMutationSet'
        bindings:
          $ref: '#/components/schemas/CredentialBindingMutationSet'
      additionalProperties: false
    CredentialMutationSet:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        replace:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        delete:
          type: array
          items:
            type: string
      additionalProperties: false
    CredentialBindingMutationSet:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/CredentialBinding'
        replace:
          type: array
          items:
            $ref: '#/components/schemas/CredentialBinding'
        delete:
          type: array
          items:
            type: string
      additionalProperties: false
    CredentialVaultState:
      type: object
      required: [revision, credentials, bindings]
      properties:
        revision:
          type: integer
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMetadata'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/CredentialBindingMetadata'
      additionalProperties: false
    CredentialListResponse:
      type: object
      required: [revision, credentials]
      properties:
        revision:
          type: integer
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMetadata'
      additionalProperties: false
    CredentialBindingListResponse:
      type: object
      required: [revision, bindings]
      properties:
        revision:
          type: integer
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/CredentialBindingMetadata'
      additionalProperties: false
    CredentialMetadata:
      type: object
      required: [name, sourceType, revision]
      properties:
        name:
          type: string
        sourceType:
          type: string
          description: Credential source kind (`inline` or `exchange`).
        revision:
          type: integer
      additionalProperties: false
    CredentialBindingMetadata:
      type: object
      required: [name, revision]
      properties:
        name:
          type: string
        revision:
          type: integer
        match:
          $ref: '#/components/schemas/CredentialMatch'
        auth:
          $ref: '#/components/schemas/CredentialAuthMetadata'
      additionalProperties: false
    Credential:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
        source:
          $ref: '#/components/schemas/CredentialSource'
      additionalProperties: false
    CredentialSource:
      type: object
      required: [type]
      description: |
        Where the credential material comes from. Exactly one kind, selected
        by `type`:

        - `inline`: the secret value travels in this request via `value`.
          Inline values are write-only and never appear in reads.
        - `exchange`: no local material. Egress resolves header sets per
          request from a header-resolver service addressed by `endpoint`.
          Supported endpoint forms are `unix:///absolute/path` (HTTP over a
          Unix domain socket) and `https://host[:port]` (TLS); anything else
          is rejected with 400.

        Fields of the other kind must be absent; for example `value` together
        with `type: exchange` is rejected with 400.
      properties:
        type:
          type: string
          enum: [inline, exchange]
        value:
          type: string
          writeOnly: true
          description: |
            Inline secret value. Required when `type` is `inline`; must be
            absent otherwise.
        endpoint:
          type: string
          description: |
            Header-resolver endpoint. Required when `type` is `exchange`; must
            be absent otherwise.
      additionalProperties: false
    CredentialBinding:
      type: object
      required: [name, match, auth]
      properties:
        name:
          type: string
        match:
          $ref: '#/components/schemas/CredentialMatch'
        auth:
          $ref: '#/components/schemas/CredentialAuth'
      additionalProperties: false
    CredentialMatch:
      type: object
      required: [hosts]
      properties:
        schemes:
          type: array
          items:
            type: string
            enum: [https, http]
          default: [https]
        ports:
          type: array
          items:
            type: integer
          deprecated: true
          description: "Deprecated. Port is derived from scheme (https→443, http→80). Values other than 80 or 443 are rejected with a validation error. Standard values (80/443) are accepted but ignored."
        hosts:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string
          default: [GET, POST, PUT, PATCH, DELETE]
        paths:
          type: array
          items:
            type: string
          default: ["/*"]
      additionalProperties: false
    CredentialAuth:
      type: object
      description: |
        How a binding injects credential material. Exactly one auth kind:

        - `bearer`: `type: bearer` plus `credential`.
        - `basic`: `type: basic` plus `credential`.
        - `apiKey`: `type: apiKey` plus `name` and `credential`.
        - `customHeaders`: `type: customHeaders` plus `headers`.
        - `passthrough`: `type: passthrough`, no credential reference.
        - typeless exchange: `type` omitted with only `credential` set. The
          referenced credential must be exchange-sourced; egress resolves the
          header set per request from the credential's endpoint.

        Static kinds must reference inline-sourced credentials, and the
        typeless form must reference an exchange-sourced credential and must
        not set `name`, `headers`, or `substitutions`. The five static kinds
        accept optional `substitutions`. Violations are rejected with 400.
      properties:
        type:
          type: string
          enum: [bearer, basic, apiKey, customHeaders, passthrough]
          description: Static auth kind. Omit entirely for the typeless exchange form.
        credential:
          type: string
          description: |
            Name of the sandbox-local credential whose value is injected. For
            `basic` the referenced credential contains pre-encoded
            base64(username:password). Required for `bearer`, `basic`,
            `apiKey`, and the typeless exchange form; must be absent otherwise.
        name:
          type: string
          pattern: '^[A-Za-z0-9!#$%&''*+\-.^_`|~]+$'
          description: Request header name. Required for `apiKey`; must be absent otherwise.
        headers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomHeaderEntry'
          description: Static header set. Required for `customHeaders`; must be absent otherwise.
        substitutions:
          type: array
          items:
            $ref: '#/components/schemas/CredentialSubstitution'
          description: |
            Optional placeholder replacement set. Accepted for the five static
            kinds; must be absent for the typeless exchange form.
      additionalProperties: false
    CustomHeaderEntry:
      type: object
      required: [name, credential]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9!#$%&''*+\-.^_`|~]+$'
        credential:
          type: string
      additionalProperties: false
    CredentialSubstitution:
      type: object
      required: [credential, placeholder, in]
      description: Literal case-sensitive placeholder replacement for selected request surfaces. Replacement is opt-in and scoped per binding.
      properties:
        credential:
          type: string
          description: Name of the sandbox-local credential used as the replacement value.
        placeholder:
          type: string
          minLength: 1
          description: Literal placeholder to replace. The placeholder and resolved credential value are added to the active redaction set.
        in:
          type: array
          minItems: 1
          items:
            type: string
            enum: [path, query, header, body]
          description: Request surfaces where the placeholder may be replaced. Query and path replacements are URL-encoded, JSON string bodies are escaped, x-www-form-urlencoded bodies are form-encoded, compressed bodies are skipped, and multipart bodies are skipped.
      additionalProperties: false
    CredentialAuthMetadata:
      type: object
      description: Sanitized auth shape — `type` (plus `name` for `apiKey`) for static kinds; `credential` only for the typeless exchange form.
      properties:
        type:
          type: string
        name:
          type: string
        credential:
          type: string
      additionalProperties: false
