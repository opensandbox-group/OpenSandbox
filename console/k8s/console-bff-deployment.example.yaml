# 示例 Deployment：与 opensandbox-server 同 namespace，Lifecycle 走集群内 Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-console-bff
  namespace: opensandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensandbox-console-bff
  template:
    metadata:
      labels:
        app: opensandbox-console-bff
    spec:
      containers:
        - name: bff
          image: YOUR_REGISTRY/opensandbox-console-bff:0.1.0
          ports:
            - containerPort: 8091
          env:
            # 仅影响容器内日志/默认 locale；API 与前端展示时间仍按 UTC 处理
            - name: TZ
              value: "UTC"
            - name: LIFECYCLE_API_BASE
              value: "http://opensandbox-server:8090/v1"
            - name: TENANTS_TOML_PATH
              value: "/etc/opensandbox/tenants.toml"
            - name: BFF_COOKIE_SECURE
              value: "true"
            - name: BFF_CORS_ORIGINS
              value: "https://console.example.com"
            # 平台探测和 ServiceAccount 不在本 PR；保持关闭，避免引用尚未提供的 RBAC。
            - name: BFF_K8S_PROBE_ENABLED
              value: "false"
            # 仅当 in-cluster apiserver TLS 与 SA CA 不匹配时启用（与 Server config.toml 无关）
            # - name: BFF_K8S_INSECURE_SKIP_TLS_VERIFY
            #   value: "true"
            - name: BFF_K8S_CONTROLLER_DEPLOYMENT
              value: "opensandbox-controller-manager"
            - name: BFF_K8S_INGRESS_DEPLOYMENT
              value: "opensandbox-ingress-gateway"
          envFrom:
            - secretRef:
                name: opensandbox-console-bff
          volumeMounts:
            - name: tenants
              mountPath: /etc/opensandbox/tenants.toml
              subPath: tenants.toml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: tenants
          configMap:
            name: opensandbox-tenants
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-console-bff
  namespace: opensandbox-system
spec:
  selector:
    app: opensandbox-console-bff
  ports:
    - port: 8091
      targetPort: 8091
