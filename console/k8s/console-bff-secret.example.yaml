# 示例：BFF 专用 Secret（勿提交真实值；生产用 sealed-secrets / 外部密钥管理）
apiVersion: v1
kind: Secret
metadata:
  name: opensandbox-console-bff
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/name: opensandbox-console-bff
type: Opaque
stringData:
  BFF_SESSION_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  BFF_ADMIN_TOKEN: "REPLACE_WITH_ADMIN_LOGIN_TOKEN"
  # 可选：若不用 ConfigMap 挂载 tenants，可整文件放这里
  # tenants.toml: |
  #   [[tenants]]
  #   name = "geip"
  #   ...
