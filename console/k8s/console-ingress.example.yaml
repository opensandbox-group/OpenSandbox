# 对外入口：Web nginx 同域反代 /api → BFF（推荐）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensandbox-console
  namespace: opensandbox-system
spec:
  rules:
    - host: console.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensandbox-console-web
                port:
                  number: 80
