server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://opensandbox-console-bff.opensandbox-system.svc.cluster.local:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://opensandbox-console-bff.opensandbox-system.svc.cluster.local:8091/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
