[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opensandbox-resolver-auth"
dynamic = ["version"]
description = "OpenSandbox resolver caller-authentication verification SDK (OSEP-0025)"
authors = [
    { name = "OpenSandbox Team" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["opensandbox", "credential-vault", "resolver", "jwt", "ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0,<46.0",
    "httpx>=0.27.0,<1.0",
]

[project.urls]
Homepage = "https://open-sandbox.ai"
Repository = "https://github.com/opensandbox-group/OpenSandbox"
Documentation = "https://open-sandbox.ai"
Issues = "https://github.com/opensandbox-group/OpenSandbox/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../../.."

[tool.hatch.build.targets.wheel]
packages = ["src/opensandbox_resolver_auth"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
