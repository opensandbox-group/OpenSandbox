[package]
name = "opensandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust SDK for the OpenSandbox lifecycle, execd, and egress APIs"
license = "Apache-2.0"
repository = "https://github.com/opensandbox-group/OpenSandbox"
homepage = "https://open-sandbox.ai"
documentation = "https://docs.rs/opensandbox"
readme = "README.md"
keywords = ["sandbox", "agent", "execution", "code-interpreter"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "rustls-tls",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
