<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1560" height="1070" viewBox="0 0 1560 1070" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="mP" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9333ea"/></marker>
    <marker id="mA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/></marker>

    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <linearGradient id="gHost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f0fb"/>
    </linearGradient>
    <linearGradient id="gCyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>

    <g id="ic-user" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.8 3.2-5.8 7-5.8s7 2 7 5.8"/>
    </g>
    <g id="ic-chip" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="7" y="7" width="10" height="10" rx="2"/>
      <path d="M12 3v4M12 17v4M3 12h4M17 12h4M7.5 4.5V7M16.5 4.5V7M7.5 17v2.5M16.5 17v2.5"/>
    </g>
    <g id="ic-route" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.4 18H14a4 4 0 0 0 0-8H9"/>
      <path d="M11 7l-2 3 2 3"/>
    </g>
    <g id="ic-doc" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h7.5l4 4v14h-11.5z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15.5h6"/>
    </g>
    <g id="ic-hex" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M12 2.6l8 4.7v9.4l-8 4.7-8-4.7V7.3z"/><path d="M12 8v8M8.5 10l7 4M15.5 10l-7 4" stroke-width="1.2"/>
    </g>
    <g id="ic-vm" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="12" rx="1.6"/><path d="M9 20.5h6M12 16.5v4"/>
      <path d="M8 8.5l2.6 2-2.6 2M12.4 12.8H16"/>
    </g>
    <g id="ic-box" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M12 10V4M9 6.6L12 3.6l3 3M9 14h6"/>
    </g>
    <g id="ic-shield" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l7 3v5.5c0 4.6-3 8-7 9.5-4-1.5-7-4.9-7-9.5V6z"/><path d="M9 11.8l2.2 2.2 4-4"/>
    </g>
  </defs>

  <style>
    .t-title{font-size:24px;font-weight:700;fill:#0f172a}
    .t-sub{font-size:12px;fill:#475569}
    .t-zone{font-size:11.5px;font-weight:700;letter-spacing:.4px}
    .t-name{font-size:13.5px;font-weight:700;fill:#0f172a}
    .t-body{font-size:10.8px;fill:#334155}
    .t-small{font-size:9.6px;fill:#64748b}
    .t-flow{font-size:10px;font-weight:600}
  </style>

  <rect width="1560" height="1070" fill="#f1f5f9"/>
  <text x="40" y="40" class="t-title">OpenSandbox × fast-sandbox — integration environment architecture</text>
  <text x="40" y="60" class="t-sub">one kind cluster (KVM passthrough) · OpenSandbox server / ingress / egress source-built · golden images through the template API · DART P2P artifact delivery</text>

  <!-- ======================= host ======================= -->
  <rect x="30" y="76" width="1500" height="946" rx="18" fill="url(#gHost)" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
  <text x="52" y="102" class="t-small">Linux KVM host · /dev/kvm · XFS StateRoot (reflink)</text>

  <!-- client -->
  <g>
    <rect x="670" y="92" width="230" height="66" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/>
    <use xlink:href="#ic-user" href="#ic-user" x="688" y="106" width="26" height="26" color="#334155"/>
    <text x="726" y="117" class="t-name">Client / SDK</text>
    <text x="726" y="134" class="t-small">up-verify drives the full flow</text>
  </g>

  <!-- MinIO -->
  <g>
    <path d="M1305 215 v200 a45 16 0 0 0 90 0 v-200" fill="url(#gCyl)" stroke="#a16207" stroke-width="2"/>
    <ellipse cx="1350" cy="215" rx="45" ry="16" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="1272" y="272" class="t-name" fill="#713f12">MinIO</text>
    <text x="1272" y="290" class="t-body">artifact store</text>
    <text x="1272" y="305" class="t-body">golden set per build</text>
    <text x="1272" y="320" class="t-body">+ per-template index</text>
  </g>

  <!-- ================= ns opensandbox-system ================= -->
  <rect x="120" y="196" width="1140" height="150" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="140" y="218" class="t-zone" fill="#0f766e">NS  OPENSANDBOX-SYSTEM</text>

  <!-- server card -->
  <g>
    <rect x="160" y="228" width="540" height="104" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" filter="url(#sh)"/>
    <use xlink:href="#ic-chip" href="#ic-chip" x="178" y="244" width="28" height="28" color="#0f766e"/>
    <text x="220" y="256" class="t-name">OpenSandbox server</text>
    <text x="220" y="276" class="t-body">fleets runtime · template catalog (store) + watch reactor</text>
    <text x="220" y="292" class="t-body">creates sandboxes via FastPath · signs f1.* gateway routes</text>
    <g>
      <path d="M594 258 v34 a13 5 0 0 0 26 0 v-34" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
      <ellipse cx="607" cy="258" rx="13" ry="5" fill="#99f6e4" stroke="#0f766e" stroke-width="1.6"/>
      <text x="586" y="316" class="t-small">templates</text>
    </g>
  </g>

  <!-- ingress card -->
  <g>
    <rect x="730" y="228" width="530" height="104" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" filter="url(#sh)"/>
    <use xlink:href="#ic-route" href="#ic-route" x="748" y="244" width="28" height="28" color="#0f766e"/>
    <text x="790" y="256" class="t-name">ingress gateway</text>
    <text x="790" y="276" class="t-body">verifies f1.* scopes · resolves sandbox endpoints</text>
    <text x="790" y="292" class="t-body">proxies client traffic into sandboxes</text>
  </g>

  <!-- ================= ns fast-sandbox-system ================= -->
  <rect x="120" y="376" width="1140" height="128" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="140" y="398" class="t-zone" fill="#1d4ed8">NS  FAST-SANDBOX-SYSTEM</text>

  <g>
    <rect x="160" y="408" width="470" height="84" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh)"/>
    <use xlink:href="#ic-chip" href="#ic-chip" x="178" y="424" width="28" height="28" color="#1d4ed8"/>
    <text x="220" y="436" class="t-name">controller + FastPath</text>
    <text x="220" y="456" class="t-body">owns Sandbox / SandboxPool / SandboxTemplate CRs</text>
    <text x="220" y="472" class="t-body">placement &amp; capacity · spawns template builders</text>
  </g>

  <g>
    <rect x="700" y="408" width="240" height="84" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.8" filter="url(#sh)"/>
    <use xlink:href="#ic-doc" href="#ic-doc" x="716" y="424" width="26" height="26" color="#b45309"/>
    <text x="752" y="436" class="t-name" fill="#92400e">SandboxTemplate CR</text>
    <text x="752" y="456" class="t-body">build spec + exact index key</text>
    <text x="752" y="472" class="t-body">status: phase · manifestRef</text>
  </g>
  <g>
    <rect x="980" y="408" width="280" height="84" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh)"/>
    <use xlink:href="#ic-doc" href="#ic-doc" x="996" y="424" width="26" height="26" color="#1d4ed8"/>
    <text x="1032" y="436" class="t-name">Sandbox CR</text>
    <text x="1032" y="456" class="t-body">spec: image · policy bindings</text>
    <text x="1032" y="472" class="t-body">status: runtime · data plane</text>
    <text x="996" y="486" class="t-small">written via FastPath · watched by the server</text>
  </g>

  <!-- server watches Sandbox CRs (LIST/WATCH informer) -->
  <path d="M 700 306 C 840 328, 920 372, 976 428" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mB)"/>
  <text x="796" y="322" class="t-flow" fill="#1d4ed8">watch (informer)</text>

  <!-- ================= nodes ================= -->
  <text x="120" y="522" class="t-small">kind cluster · control-plane taint removed — both nodes schedule the data plane</text>

  <!-- node A -->
  <g>
    <rect x="120" y="530" width="710" height="462" rx="14" fill="url(#gNode)" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
    <use xlink:href="#ic-chip" href="#ic-chip" x="140" y="546" width="22" height="22" color="#1d4ed8"/>
    <text x="172" y="562" class="t-name">kind node A</text>

    <g>
      <rect x="140" y="580" width="310" height="76" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 4"/>
      <use xlink:href="#ic-box" href="#ic-box" x="156" y="596" width="26" height="26" color="#b45309"/>
      <text x="194" y="606" class="t-name" fill="#92400e">builder Pod</text>
      <text x="194" y="626" class="t-body">bakes the golden image (source + execd)</text>
      <text x="194" y="642" class="t-small">privileged · transient</text>
    </g>

    <g>
      <rect x="480" y="580" width="330" height="76" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#sh)"/>
      <use xlink:href="#ic-hex" href="#ic-hex" x="498" y="596" width="26" height="26" color="#9333ea"/>
      <text x="536" y="606" class="t-name" fill="#6b21a8">runtime-agent + DART</text>
      <text x="536" y="626" class="t-body">resolves index → pulls artifacts P2P</text>
      <text x="536" y="642" class="t-small">per-node cache</text>
    </g>

    <g>
      <rect x="140" y="672" width="670" height="112" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8" filter="url(#sh)"/>
      <text x="156" y="692" class="t-name" fill="#155e75">fastlet Pod</text>
      <rect x="156" y="700" width="300" height="68" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="170" y="720" class="t-name">fastlet</text>
      <text x="170" y="738" class="t-body">restores microVMs from snapshots</text>
      <text x="170" y="754" class="t-body">serves sandbox traffic (proxy)</text>
      <rect x="494" y="700" width="300" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
      <use xlink:href="#ic-shield" href="#ic-shield" x="506" y="712" width="20" height="20" color="#ea580c"/>
      <text x="534" y="726" class="t-name" fill="#9a3412">egress</text>
      <text x="534" y="744" class="t-body">per-sandbox network policy (dns+nft)</text>
      <text x="534" y="760" class="t-small">driven by fastlet over loopback</text>
    </g>

    <g>
      <rect x="140" y="798" width="670" height="106" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8" filter="url(#sh)"/>
      <use xlink:href="#ic-vm" href="#ic-vm" x="158" y="822" width="40" height="40" color="#a16207"/>
      <text x="212" y="838" class="t-name" fill="#713f12">firecracker microVM</text>
      <text x="212" y="858" class="t-body">execd :44772 baked into the golden image</text>
      <text x="212" y="876" class="t-small">snapshot restore · isolated kernel per sandbox</text>
      <line x1="475" y1="784" x2="475" y2="798" stroke="#16a34a" stroke-width="2.2" marker-end="url(#mG)"/>
    </g>
  </g>

  <!-- node B -->
  <g>
    <rect x="850" y="530" width="410" height="462" rx="14" fill="url(#gNode)" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
    <use xlink:href="#ic-chip" href="#ic-chip" x="870" y="546" width="22" height="22" color="#1d4ed8"/>
    <text x="902" y="562" class="t-name">kind node B</text>

    <g>
      <rect x="870" y="580" width="360" height="76" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#sh)"/>
      <use xlink:href="#ic-hex" href="#ic-hex" x="888" y="596" width="26" height="26" color="#9333ea"/>
      <text x="926" y="606" class="t-name" fill="#6b21a8">runtime-agent + DART</text>
      <text x="926" y="626" class="t-body">first pull served by the peer</text>
      <text x="926" y="642" class="t-small">cache → peer → origin</text>
    </g>

    <g>
      <rect x="870" y="672" width="360" height="112" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8" filter="url(#sh)"/>
      <text x="886" y="692" class="t-name" fill="#155e75">fastlet Pod</text>
      <rect x="886" y="700" width="150" height="68" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="898" y="726" class="t-name">fastlet</text>
      <rect x="1050" y="700" width="164" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
      <use xlink:href="#ic-shield" href="#ic-shield" x="1060" y="712" width="18" height="18" color="#ea580c"/>
      <text x="1084" y="726" class="t-name" fill="#9a3412">egress</text>
    </g>

    <g>
      <rect x="870" y="798" width="360" height="106" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8" filter="url(#sh)"/>
      <use xlink:href="#ic-vm" href="#ic-vm" x="888" y="822" width="36" height="36" color="#a16207"/>
      <text x="936" y="840" class="t-name" fill="#713f12">microVM</text>
      <text x="936" y="860" class="t-body">execd :44772</text>
      <line x1="1050" y1="784" x2="1050" y2="798" stroke="#16a34a" stroke-width="2.2" marker-end="url(#mG)"/>
    </g>
  </g>

  <!-- ================= flows ================= -->
  <path d="M 740 158 C 700 180, 560 190, 480 228" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#mB)"/>
  <path d="M 830 158 C 870 180, 990 190, 1060 228" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#mG)"/>
  <text x="560" y="182" class="t-flow" fill="#1d4ed8">lifecycle API</text>
  <text x="930" y="182" class="t-flow" fill="#16a34a">signed routes</text>

  <path d="M 430 332 C 430 360, 390 372, 390 408" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#mB)"/>
  <path d="M 995 332 C 995 360, 590 372, 570 408" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#mB)"/>
  <text x="440" y="362" class="t-flow" fill="#1d4ed8">gRPC</text>

  <path d="M 1240 332 C 1300 420, 1290 560, 1235 672" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#mG)"/>
  <text x="1292" y="470" class="t-flow" fill="#16a34a" transform="rotate(75 1292 470)">client traffic</text>

  <path d="M 320 492 C 320 530, 380 560, 430 672" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mB)"/>
  <path d="M 560 492 C 600 540, 900 560, 1000 672" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mB)"/>
  <text x="330" y="522" class="t-flow" fill="#1d4ed8">control</text>

  <path d="M 640 332 C 680 372, 730 380, 770 408" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#mA)"/>
  <circle cx="700" cy="356" r="11" fill="#b45309"/><text x="700" y="360" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="716" y="352" class="t-flow" fill="#92400e">create CR + catalog row</text>

  <path d="M 700 492 C 620 540, 420 540, 330 580" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#mA)"/>
  <circle cx="475" cy="538" r="11" fill="#b45309"/><text x="475" y="542" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="492" y="534" class="t-flow" fill="#92400e">spawn builder</text>

  <path d="M 450 618 C 700 520, 1100 470, 1330 442" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#mA)"/>
  <circle cx="985" cy="510" r="11" fill="#b45309"/><text x="985" y="514" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="940" y="494" class="t-flow" fill="#92400e">publish artifacts + index</text>

  <path d="M 760 460 C 640 440, 560 400, 540 336" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#mA)"/>
  <circle cx="610" cy="418" r="11" fill="#b45309"/><text x="610" y="422" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="540" y="404" class="t-flow" fill="#92400e">watch → Succeeded</text>

  <circle cx="404" cy="356" r="11" fill="#b45309"/><text x="404" y="360" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="418" y="336" class="t-flow" fill="#92400e">templateId create (image = tpl-id)</text>

  <path d="M 812 616 C 838 606, 846 606, 868 616" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-dasharray="7 4" marker-start="url(#mP)" marker-end="url(#mP)"/>
  <text x="840" y="596" class="t-flow" fill="#6b21a8" text-anchor="middle">peer</text>

  <path d="M 1298 618 C 1372 590, 1382 520, 1370 448" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#mP)"/>
  <circle cx="1352" cy="528" r="11" fill="#9333ea"/><text x="1352" y="532" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="1332" y="512" class="t-flow" fill="#6b21a8" text-anchor="end">first create: pull</text>

  <!-- ================= legend ================= -->
  <g>
    <line x1="1280" y1="992" x2="1312" y2="992" stroke="#1d4ed8" stroke-width="2.4"/><text x="1316" y="996" class="t-small">control</text>
    <line x1="1280" y1="1010" x2="1312" y2="1010" stroke="#16a34a" stroke-width="2.4"/><text x="1316" y="1014" class="t-small">data</text>
    <line x1="1372" y1="992" x2="1404" y2="992" stroke="#9333ea" stroke-width="2.4" stroke-dasharray="7 4"/><text x="1408" y="996" class="t-small">artifacts</text>
    <line x1="1372" y1="1010" x2="1404" y2="1010" stroke="#b45309" stroke-width="2.4" stroke-dasharray="7 4"/><text x="1408" y="1014" class="t-small">template build ①-⑥</text>
    <text x="120" y="996" class="t-small">up flow: template ①-④ → sandboxes via ⑤⑥ (cold = DART pull · warm = cached) → gateway /ping → policy → delete</text>
    <text x="120" y="1014" class="t-small">source-built: server · ingress · egress — execd baked into the golden image — fast-sandbox @ master</text>
  </g>
</svg>
