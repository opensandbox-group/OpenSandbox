# OSEP-0024 profile: ephemeral Redis for activity keys and pause locks.
# Applied into the opensandbox-system namespace by integration-env.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-pause-redis
  labels:
    app: idle-pause-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idle-pause-redis
  template:
    metadata:
      labels:
        app: idle-pause-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idle-pause-redis
  labels:
    app: idle-pause-redis
spec:
  selector:
    app: idle-pause-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
