# firecracker-egress-resource-aware-pool.yaml — the OSEP-0026 ResourceAware
# SandboxPool fixture of the fast-sandbox integration environment (T4).
#
# Byte-identical to the legacy pool (firecracker-egress-pool.yaml — egress
# attached through the Sandbox Actions channel, P2P spread, on-demand
# loading, the same render-token set) except for exactly two deltas, which
# is all the OSEP-0026 E2E fixture needs:
#
#   metadata.name    firecracker-egress-resource-aware-pool
#
#   sandboxResources mode: ResourceAware + overcommitRatio — the pool's
#                    cpu/memory/pids become runtime limits and per-request
#                    defaults instead of fixed slot shapes: FastPath derives
#                    each sandbox's commitment as ceil(limit / ratio) in its
#                    heterogeneous request ledger (pressure-aware admission),
#                    the Firecracker runtime enforces host cgroup budgets per
#                    sandbox, and callers may override cpu/memory per create.
#                    Ratios: CPU 4x (compressible), memory 2x (node RAM is
#                    the hard backstop) — a default-shape sandbox (1 CPU /
#                    512Mi) commits 250m CPU / 256Mi, so the same node packs
#                    more sandboxes than the legacy slot accounting.
#
# Everything else (fastlet/egress containers, MITM CA seed, volumes,
# capacity, anti-affinity, infraComponents/actionHandlers wiring) is kept in
# lockstep with the legacy pool: apply-driven capacity only, no sandboxes
# created by the environment itself.
#
# Tokens rendered by integration-env.sh (pool stage, into $WORK/gen):
#   "@FASTLET_IMAGE@"  "@EGRESS_IMAGE@"  "@POOL_MIN@"  "@POOL_MAX@"
#   "@MITM_CA_SECRET@"  the pool-pinned MITM CA Secret (seed mount)
#   # @WARM_IMAGES@  -> warmImages block when WARM_IMAGES=1
#   # @OCI_FASTLET_ENV@ / # @OCI_FASTLET_MOUNTS@ / # @OCI_FASTLET_VOLUMES@
#   -> the fastlet OCI env item + shared mounts/volumes when OCI_STACK=1
#   (registry config is compiled into Fastlets by the pool controller)
# (quoted in the template so the file stays valid YAML; the render step
# substitutes the token including its quotes)
#
# Selected with POOL_MODE=resource-aware on `up` / `pool` (default legacy);
# POOL_NAME and the server's fastpath_resource_pool follow the profile.
apiVersion: sandbox.fast.io/v1alpha2
kind: SandboxPool
metadata:
  name: firecracker-egress-resource-aware-pool
  namespace: opensandbox-dataplane
spec:
  fastletTemplate:
    spec:
      containers:
      - name: fastlet
        image: "@FASTLET_IMAGE@"
        imagePullPolicy: IfNotPresent
        env:
        - name: FAST_SANDBOX_RUNTIME_AGENT_SOCKET
          value: /run/fast-sandbox/firecracker/runtime.sock
# @OCI_FASTLET_ENV@
        volumeMounts:
        - name: agent-socket
          mountPath: /run/fast-sandbox/firecracker
# @OCI_FASTLET_MOUNTS@
      - name: egress
        image: "@EGRESS_IMAGE@"
        # IfNotPresent: the environment kind-loads the image into the
        # nodes; Always would force a docker.io pull per restart.
        imagePullPolicy: IfNotPresent
        # Fast Sandbox profile is required: it serves the Sandbox Actions Handler
        # endpoints (/_fastlet/v1/actions[/status]) that the Fastlet uses.
        # Without it egress runs the sidecar profile (policy-file driven)
        # and exposes no actions surface.
        env:
        - name: OPENSANDBOX_EGRESS_PROFILE
          value: "fast-sandbox"
        # dns+nft: DNS-based domain policy plus the per-subject nft rules
        # (table opensandbox-fast-sandbox, subj_ chains). dns-only would neither
        # block IP-direct traffic nor create the subj_ chains.
        - name: OPENSANDBOX_EGRESS_MODE
          value: "dns+nft"
        # Vault persistence (OSEP-0022 stage 2): one per-subject file under
        # this directory backs the vault relay ack — an egress restart
        # recovers locally at SET_BINDING replay, no server re-push. The
        # volume is the Pod-scoped egress-vault emptyDir below. Unset would
        # keep the vault memory-only (lost on egress restart).
        - name: OPENSANDBOX_EGRESS_VAULT_DIR
          value: /var/lib/opensandbox-egress/vault
        # Policy persistence: REQUIRED for the fast-sandbox profile — the
        # egress fails startup without it. One per-subject policy file under
        # this directory backs the /policy/{uid} relay ack (persist → apply
        # → ack) and carries the POLICY_EXPORT / POLICY_IMPORT snapshot
        # transfer. Lives on the same Pod-scoped volume as the vault files.
        - name: OPENSANDBOX_EGRESS_POLICY_DIR
          value: /var/lib/opensandbox-egress/policy
        # MITM trust anchor (OSEP-0022): enable the shared mitmdump and pin
        # it to the seed-mounted CA (below). The extra-CA file makes the
        # upstream leg verify against the pinned CA as well.
        - name: OPENSANDBOX_EGRESS_MITMPROXY_TRANSPARENT
          value: "true"
        - name: OPENSANDBOX_EGRESS_MITM_CA_SEED_DIR
          value: /var/egress/mitm-ca-seed
        - name: OPENSANDBOX_EGRESS_MITMPROXY_UPSTREAM_EXTRA_CA
          value: /var/egress/mitm-ca-seed/tls.crt
        volumeMounts:
        - name: egress-vault
          # Plaintext v1 posture: the vault volume joins the credential
          # trust surface. Swap to `medium: Memory` (tmpfs) to keep the
          # per-subject vault files off node disk.
          mountPath: /var/lib/opensandbox-egress
        # Vault bundle handoff (OSEP-0022): the envelope carries the
        # driver's staging path under the runtime state root; mount the
        # same runtime-injected volume so the path resolves here.
        - name: firecracker-state
          mountPath: /var/lib/fast-sandbox/firecracker
        # MITM trust anchor (OSEP-0022): the pool-pinned CA keypair rides a
        # read-only seed mount; egress copies it idempotently into the
        # mitmdump confdir and never generates a CA (missing/unloadable seed
        # fails the MITM addon closed, surfaced on /healthz). The extra-CA
        # env pins the mitmdump->upstream leg to the same CA (the echo
        # upstream presents a certificate signed by it).
        - name: mitm-ca-seed
          mountPath: /var/egress/mitm-ca-seed
          readOnly: true
        # Egress installs nft/iptables rules (DNS redirect + per-subject
        # sets) and marks sockets; NET_ADMIN covers nft/iptables/SO_MARK,
        # NET_RAW covers the raw sockets used for DNS response spoofing.
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        # Platform validation requires non-zero CPU and memory limits on
        # every sidecar container so the Pod cgroup stays bounded.
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: agent-socket
        hostPath:
          path: /run/fast-sandbox/firecracker
          type: DirectoryOrCreate
      # Pod-scoped vault volume (OSEP-0022 stage 2): survives an egress
      # container crash/restart (the reload path), dies with the Pod.
      # medium: Memory would keep the plaintext v1 files off node disk.
      - name: egress-vault
        emptyDir: {}
# @OCI_FASTLET_VOLUMES@
      # Pool-pinned MITM CA keypair (OSEP-0022, ops-runbook shape): the
      # versioned Secret copy lives in the pool namespace with the keypair
      # entries the seed mount expects (tls.crt + tls.key). In this env the
      # template-build namespace coincides with the pool namespace, so the
      # same Secret also carries the certificate-only entry (ca.crt) the
      # server references for the template bake.
      - name: mitm-ca-seed
        secret:
          secretName: "@MITM_CA_SECRET@"
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      nodeSelector:
        fast-sandbox.io/firecracker-node: "true"
      # P2P topology: spread the poolMin fastlets one per node so each
      # node's on-demand pull exercises the OTHER node's DART peer. On a
      # single node this is a no-op (only one eligible node exists).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandbox-fastlet
              topologyKey: kubernetes.io/hostname
  capacity:
    poolMin: "@POOL_MIN@"
    poolMax: "@POOL_MAX@"
    bufferMin: 0
    bufferMax: 0
  maxSandboxesPerPod: 5
  runtime: firecracker
  # host-process declaration: no artifact is delivered; Fastlet probes the
  # Pod-loopback listener (127.0.0.1:18080) before data-plane-ready and
  # never includes egress in the guest sandbox-init supervisor config.
  infraComponents:
  - name: egress
    delivery: host-process
    process:
      command: ["/bin/egress"]
      healthCheck:
        tcpConnect: {}
        timeoutSeconds: 10
    endpoint:
      protocol: HTTP
      port: 18080
  actionHandlers:
  - name: egress
    targetHTTPPort: 18080
    hooks: [sandbox.runtime-ready, sandbox.data-plane-ready]
  sandboxResources:
    # OSEP-0026: ResourceAware accounting — cpu/memory below are runtime
    # limits and per-create defaults (a caller may override them per
    # Sandbox); overcommitRatio (required in this mode) is how FastPath
    # derives each sandbox's committed request: ceil(limit / ratio).
    mode: ResourceAware
    cpu: "1"
    memory: 512Mi
    pids: 128
    overcommitRatio:
      # CPU overcommit 4x: vCPUs are compressible (cgroup cpu.max weights +
      # throttling), so a default-shape sandbox commits 250m CPU.
      cpu: "4"
      # Memory overcommit 2x: Firecracker guest RAM is backed by host pages
      # with no swap inside the guest, so the ratio stays conservative — a
      # default-shape sandbox commits 256Mi against its 512Mi limit.
      memory: "2"
# @WARM_IMAGES@
