# REQUIRED persistent fence. Copy this file to the dedicated Web profile's
# cordis.patch.yml BEFORE its first startup. Keep it even when the bundle is
# disabled/removed. Restart after configuration changes; no hot migration.
# This disables unverified host-execution/artifact paths, not native session
# history or model/credential storage. Deliberate higher-layer edits are outside
# the supported envelope. Do not add stock/third-party presets to this profile.
- id: agent-loop
  inject:
    - opensandboxNativeReady
    - agentPresets
- id: session-controller
  inject:
    - opensandboxNativeReady
    - agentPresets
  config:
    nativeOpen: false
- id: webserver
  inject:
    - webStartup
    - opensandboxNativeReady
    - agentPresets
- id: agent-preset-registry
  config:
    default: opensandbox
    selectedDefault: opensandbox
# Native Web still needs a local workspace identity for session/history metadata.
# This empty profile-owned directory is not mapped into the remote sandbox.
- id: workspace-controller
  config:
    documentsDirectory: !!js ctx.get('profileContext').dir + '/workspace-metadata'
