server:
  env:
    - name: OPENSANDBOX_SERVER_API_KEY
      valueFrom:
        secretKeyRef:
          name: opensandbox-api-key
          key: api-key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  volumeMounts:
    - name: peerpods-template
      mountPath: /etc/opensandbox/peerpods-template.yaml
      subPath: batchsandbox-template.yaml
      readOnly: true
  volumes:
    - name: peerpods-template
      configMap:
        name: ack-peerpods-template

configToml: |
  [server]
  host = "0.0.0.0"
  port = 80

  [runtime]
  type = "kubernetes"
  execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.2.0"

  [kubernetes]
  namespace = "opensandbox-peerpods"
  workload_provider = "batchsandbox"
  batchsandbox_template_file = "/etc/opensandbox/peerpods-template.yaml"
  sandbox_create_timeout_seconds = 600

  [secure_runtime]
  type = "kata"
  k8s_runtime_class = "kata-remote"
