apiVersion: v1
kind: ConfigMap
metadata:
  name: eks-nitro-batchsandbox-template
  namespace: opensandbox-system
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        example.opensandbox.io/profile: eks-nitro
    spec:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          # NOTE: unlike the aks-kata example, do NOT set nodeSelector or
          # tolerations here. For EKS Pod Isolation the isolated-sandbox
          # RuntimeClass (applied via secure_runtime.type = "nitro") already
          # carries scheduling.nodeSelector = {eks.amazonaws.com/nitro-sandbox: "true"},
          # and the cluster's add-sandbox-toleration admission policy injects the
          # workload=isolated:NoSchedule toleration the NodePool taint requires.
          # runtimeClassName alone is the entire opt-in.
