apiVersion: bench.opensandbox.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: fast-sandbox-overlaybd-ref
runtime: fast-sandbox-overlaybd
environment:
  systemNamespace: opensandbox-system
  resourceNamespace: opensandbox-dataplane
  benchNamespace: opensandbox-bench
  prepareNodes: false
  runner:
    baseImage: alpine:3.20
    cpuLimit: "4"
    memoryLimit: "4Gi"
  imageRegistryMirror: ""
  registry:
    ephemeralInCluster: true
    image: registry:2
    storageSize: 200Gi
  redis:
    enabled: true
  tracing:
    inCluster: true
    backend: jaeger
    sampler: parentbased_traceidratio
    defaultSamplerArg: 1.0
stack:
  chartPath: manifests/charts/opensandbox
  fastSandbox:
    runtime:
      oci:
        enabled: true
        cacheSizeGB: 16
        poolLow: 8
        poolHigh: 16
        poolSizeGB: 2
    pool:
      mode: ResourceAware
      minFastlets: 4
      maxFastlets: 8
      overcommitRatio:
        cpu: 2
        memory: 2
      egressEnabled: true
      spillDir: /dev/shm/fsb-spill
      blobCacheMaxBytes: 17179869184
  template:
    baseImage: opensandbox/fsb-sandbox-golden:latest
    vcpus: 1
    memoryMiB: 2048
    diskGiB: 2
suites:
  scheduleBurst:
    concurrencies: [1, 4, 8, 16, 32]
    attemptsPerLevel: 50
    readinessPollMs: 10
  steadyChurn:
    targetRps: 5
    durationSeconds: 600
    traceSamplerArg: 0.05
  pauseResume:
    modes: [warm, cache-evicted, cross-node]
    dirtyUpperMiB: [0, 16, 256]
    chainSquashRounds: 26
    chainSquashTemplateMemoryMiB: 512
  rootfsOnlyRestore:
    dirtyUpperMiB: [0, 16, 256]
    fanoutConcurrencies: [1, 8, 16]
    crossNode: true
    resourceOverrides:
      - vcpus: 2
        memoryMiB: 4096
  wakeStorm:
    fleetSize: 32
    idleThresholdSeconds: 30
    fanoutConcurrency: 32
    singleflightBurst: 16
  highDensitySoak:
    oversellTiers: [0.5, 1.0, 1.5, 2.0]
    durationSecondsPerTier: 600
    measureRecovery: true
    minStateRootFreeGiB: 10
    samplerIntervalSeconds: 2
    traceSamplerArg: 0.02
