apiVersion: v2
name: opensandbox
description: All-in-one Helm chart for deploying OpenSandbox controller and server
type: application
version: 1.1.0-rc.1
appVersion: "1.1.0-rc.1"

keywords:
  - sandbox
  - kubernetes
  - operator
  - api
  - lifecycle
  - batchsandbox

home: https://github.com/opensandbox-group/OpenSandbox
sources:
  - https://github.com/opensandbox-group/OpenSandbox/tree/main/manifests

maintainers:
  - name: OpenSandbox Team
    email: opensandbox@example.com

# Kubernetes version constraints
kubeVersion: ">=1.21.1-0"

dependencies:
  - name: base
    version: "1.1.0-rc.1"
    repository: "file://../base"
    condition: base.enabled
  - name: opensandbox-controller
    version: "1.1.0-rc.1"
    repository: "file://../controller"
  - name: opensandbox-server
    version: "1.1.0-rc.1"
    repository: "file://../server"
  - name: ingress-gateway
    version: "1.1.0-rc.1"
    repository: "file://../ingress-gateway"
    condition: ingress-gateway.enabled
  - name: opensandbox-node-agent
    version: "1.1.0-rc.1"
    repository: "file://../node-agent"
    condition: opensandbox-node-agent.enabled
  - name: fast-sandbox
    version: "1.1.0-rc.1"
    repository: "file://../fast-sandbox"
    condition: fast-sandbox.enabled

annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/opensandbox-group/OpenSandbox/blob/main/manifests/README.md
    - name: Support
      url: https://github.com/opensandbox-group/OpenSandbox/issues
