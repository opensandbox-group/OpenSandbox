            type: object
          status:
            description: |-
              SandboxSnapshotStatus defines the observed state of SandboxSnapshot.
              Status is written by Controller, read-only for callers.
            properties:
              conditions:
                description: Conditions records the readiness or failure of the snapshot.
                items:
                  description: SandboxSnapshotCondition represents a condition of
                    a SandboxSnapshot.
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable message about the condition.
                      type: string
                    reason:
                      description: Reason is a brief reason for the condition.
                      type: string
                    status:
                      description: Status is the condition status.
                      enum:
                      - "True"
                      - "False"
                      type: string
                    type:
                      description: Type is the condition type.
                      enum:
                      - Ready
                      - Failed
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              containers:
                description: Containers holds per-container snapshot results, filled
                  after Succeed.
                items:
                  description: ContainerSnapshot records the snapshot result for a
                    single container.
                  properties:
                    containerName:
                      description: ContainerName is the name of the container.
                      type: string
                    imageDigest:
                      description: ImageDigest is the config digest of the pushed
                        snapshot image.
                      type: string
                    imageUri:
                      description: ImageURI is the snapshot image URI for this container.
                      type: string
                  required:
                  - containerName
                  - imageUri
                  type: object
                type: array
              format:
                description: |-
                  Format identifies the snapshot representation. Empty means rootfs-v1 for
                  backward compatibility with snapshots created before this field existed.
                enum:
                - rootfs-v1
                - qemu-v1
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent spec generation
                  observed by the Controller.
                format: int64
                type: integer
              phase:
                description: Phase indicates the current phase of the snapshot.
                enum:
                - Pending
                - Committing
                - Succeed
                - Failed
                type: string
              sourceNodeName:
                description: SourceNodeName is the node where the source Pod runs
                  (for Job scheduling).
                type: string
              sourcePodName:
                description: SourcePodName is the name of the source Pod (resolved
                  by Controller).
                type: string
              virtualMachine:
                description: VirtualMachine contains the QEMU VM state artifact for
                  qemu-v1 snapshots.
                properties:
                  compatibility:
                    description: Compatibility contains the restore compatibility
                      summary.
                    properties:
                      architecture:
                        description: Architecture is the guest host architecture,
                          for example amd64.
                        type: string
                      cpuModel:
                        description: CPUModel is the configured virtual CPU model.
                        type: string
                      machineType:
                        description: MachineType is the versioned QEMU machine type.
                        type: string
                      memoryBytes:
                        description: MemoryBytes is the configured guest RAM in bytes.
                        format: int64
                        minimum: 1
                        type: integer
                      qemuConfigDigest:
                        description: QEMUConfigDigest identifies the normalized QEMU
