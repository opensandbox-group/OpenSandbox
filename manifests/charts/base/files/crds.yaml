                        type: string
                      qemuVersion:
                        description: QEMUVersion is the source QEMU version string.
                        type: string
                      requiredNodeClass:
                        description: RequiredNodeClass optionally constrains restore
                          to a compatible node class.
                        type: string
                      vcpus:
                        description: VCPUs is the number of virtual CPUs.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - architecture
                    - cpuModel
                    - machineType
                    - memoryBytes
                    - qemuConfigDigest
                    - qemuVersion
                    - vcpus
                    type: object
                  compression:
                    description: Compression identifies the payload compression algorithm.
                    enum:
                    - zstd
                    type: string
                  imageDigest:
                    description: ImageDigest is the digest of the pushed standard
