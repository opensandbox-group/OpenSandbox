                    type: string
                  payloadDigest:
                    description: PayloadDigest is the digest of the compressed VM
                      state payload.
                    type: string
                  sizeBytes:
                    description: SizeBytes is the compressed VM state payload size.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - compatibility
                - compression
                - imageDigest
                - imageUri
                - manifestDigest
                - payloadDigest
                - sizeBytes
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
