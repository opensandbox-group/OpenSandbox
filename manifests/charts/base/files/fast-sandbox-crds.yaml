            required:
            - sandboxRef
            - templateName
            type: object
          status:
            description: |-
              SandboxSnapshotStatus reports the observed state of one snapshot attempt.
              All fields are projections written by the control plane; the artifact
              facts come from the fastlet that executed the snapshot.
