# Default values for the OpenSandbox base chart.
# This chart installs cluster-scoped resources only: the OpenSandbox CRDs, the
# fast-sandbox CRDs (sandbox.fast.io), the shared system and dataplane
# namespaces, and the user-facing OpenSandbox CRD RBAC roles. It contains no
# workloads and can be installed once per cluster, independently of the
# controller, server, and fast-sandbox releases.

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

crds:
  # -- Specifies whether the OpenSandbox CRDs should be installed
  install: true
  # -- Keep CRDs on chart uninstall (adds the helm.sh/resource-policy: keep annotation)
  keep: true
  # -- Additional annotations to add to CRDs (merged with resource-policy when keep is true)
  annotations: {}

rbac:
  # -- Specifies whether user-facing ClusterRoles for the OpenSandbox CRD API
  # (admin/editor/viewer per resource kind) should be installed
  create: true

# fast-sandbox runtime support (sandbox.fast.io API group, synced from the
# source pinned in manifests/third-party/fast-sandbox.commit by
# manifests/release/build-fast-sandbox.sh --sync-crds).
fastSandbox:
  crds:
    # -- Specifies whether the fast-sandbox CRDs should be installed
    install: true
    # -- Keep CRDs on chart uninstall (adds the helm.sh/resource-policy: keep annotation)
    keep: true
    # -- Additional annotations to add to CRDs (merged with resource-policy when keep is true)
    annotations: {}
  namespaces:
    # -- Specifies whether the shared system namespace (the
    # fastSandbox.namespaces.system namespace, default opensandbox-system)
    # should be created. The controller/server releases and, when enabled, the
    # fast-sandbox control plane run there, so creating it here lets the
    # documented per-component install order work without a preceding
    # `kubectl create namespace` or --create-namespace. Set false when the
    # namespace is managed externally and already exists: a pre-existing
    # namespace without Helm ownership metadata cannot be adopted into this
    # release. The created namespace carries helm.sh/resource-policy: keep, so
    # it survives `helm uninstall` of this chart and must be deleted manually.
    createSystem: true
    # -- Specifies whether the fast-sandbox dataplane namespace should be
    # created. The created namespace carries helm.sh/resource-policy: keep,
    # so it survives `helm uninstall` of this chart and must be deleted
    # manually.
    create: true
    # -- Shared OpenSandbox system namespace (created by this chart when
    # createSystem is true, and targeted by fastSandbox.callerAuth when
    # enabled).
    system: opensandbox-system
    # -- Namespace for fast-sandbox resource objects (pools, templates,
    # sandboxes and the fastlet/builder Pods they spawn)
    resources: opensandbox-dataplane
  callerAuth:
    # -- Enable FastPath caller token-minting RBAC for opensandbox-server and opensandbox-ingress-gateway.
    enabled: false
    # -- Create the opensandbox-server ServiceAccount in the system namespace (set true only when running an external Server without the opensandbox-server Helm chart).
    createServerServiceAccount: false
    # -- Additional explicit RBAC subjects (User, Group, or ServiceAccount) allowed to mint tokens for opensandbox-server (e.g. external kubeconfig identities).
    externalServerSubjects: []
