{{- if and .Values.fastSandbox.rbac.create .Values.fastSandbox.callerAuth.enabled }}
{{- $namespace := .Values.fastSandbox.namespaces.system }}
{{- $callers := list
  (dict "serviceAccount" "opensandbox-server-fastpath-client" "bootstrapServiceAccount" "opensandbox-server" "subjects" .Values.fastSandbox.callerAuth.externalServerSubjects)
  (dict "serviceAccount" "opensandbox-ingress-fastpath-client" "bootstrapServiceAccount" "opensandbox-ingress-gateway" "subjects" (list))
}}
{{- range $caller := $callers }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $caller.serviceAccount }}
  namespace: {{ $namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $caller.serviceAccount }}-minter
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ $caller.serviceAccount | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $caller.serviceAccount }}-minter
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $caller.serviceAccount }}-minter
subjects:
  - kind: ServiceAccount
    name: {{ $caller.bootstrapServiceAccount }}
    namespace: {{ $namespace }}
{{- with $caller.subjects }}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
