# Read access to pods/services and BatchSandboxes so the gateway can resolve
# sandbox endpoints in the dataplane namespace.
{{- if .Values.rbac.create }}
---
apiVersion: {{ include "opensandbox-ingress-gateway.rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  name: {{ include "opensandbox-ingress-gateway.roleName" . }}
  labels:
    {{- include "opensandbox-ingress-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes", "batchsandboxes/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: {{ include "opensandbox-ingress-gateway.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "opensandbox-ingress-gateway.roleName" . }}
  labels:
    {{- include "opensandbox-ingress-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opensandbox-ingress-gateway.roleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opensandbox-ingress-gateway.serviceAccountName" . }}
    namespace: {{ include "opensandbox-ingress-gateway.namespace" . }}
{{- end }}
