{{- $metrics := .Values.controller.metrics | default dict -}}
{{- $watchedCSV := include "opensandbox.watchedNamespacesCSV" . -}}
{{- $watchedNamespaces := list -}}
{{- if $watchedCSV -}}
{{- $watchedNamespaces = splitList "," $watchedCSV -}}
{{- end -}}
{{- if .Values.rbac.create -}}
---
# Leader election role binding
apiVersion: {{ include "opensandbox.rbac.apiVersion" . }}
kind: RoleBinding
metadata:
  name: {{ include "opensandbox.leaderElectionRoleName" . }}
  namespace: {{ include "opensandbox.namespace" . }}
  labels:
    {{- include "opensandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opensandbox.leaderElectionRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "opensandbox.serviceAccountName" . }}
  namespace: {{ include "opensandbox.namespace" . }}

---
# Controller-namespace ConfigMap reader role binding
apiVersion: {{ include "opensandbox.rbac.apiVersion" . }}
kind: RoleBinding
metadata:
  name: {{ include "opensandbox.configReaderRoleName" . }}
  namespace: {{ include "opensandbox.namespace" . }}
  labels:
    {{- include "opensandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opensandbox.configReaderRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "opensandbox.serviceAccountName" . }}
  namespace: {{ include "opensandbox.namespace" . }}

{{- if $watchedNamespaces }}
{{- range $ns := $watchedNamespaces }}
---
# Manager RoleBinding (namespace-scoped to {{ $ns }})
apiVersion: {{ include "opensandbox.rbac.apiVersion" $ }}
kind: RoleBinding
metadata:
  name: {{ include "opensandbox.managerRoleName" $ }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "opensandbox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opensandbox.managerRoleName" $ }}
subjects:
- kind: ServiceAccount
  name: {{ include "opensandbox.serviceAccountName" $ }}
  namespace: {{ include "opensandbox.namespace" $ }}
{{- end }}
{{- else }}
---
# Manager role binding
apiVersion: {{ include "opensandbox.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "opensandbox.managerRoleName" . }}
  labels:
    {{- include "opensandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opensandbox.managerRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "opensandbox.serviceAccountName" . }}
  namespace: {{ include "opensandbox.namespace" . }}
{{- end }}

{{- if and $metrics.enabled $metrics.secure }}
---
# Metrics auth ClusterRoleBinding
apiVersion: {{ include "opensandbox.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "opensandbox.metricsAuthRoleName" . }}
  labels:
    {{- include "opensandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opensandbox.metricsAuthRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "opensandbox.serviceAccountName" . }}
  namespace: {{ include "opensandbox.namespace" . }}
{{- end }}

{{- end }}
