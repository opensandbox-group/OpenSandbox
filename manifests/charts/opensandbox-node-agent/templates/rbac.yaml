{{- if and .Values.enabled .Values.rbac.create }}
{{- if and (not .Values.serviceAccount.create) (empty .Values.serviceAccount.name) }}
{{- fail "serviceAccount.name must be set when rbac.create=true and serviceAccount.create=false" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opensandbox-node-agent.rbacName" . }}
  labels:
    {{- include "opensandbox-node-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opensandbox-node-agent.rbacName" . }}
  labels:
    {{- include "opensandbox-node-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opensandbox-node-agent.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opensandbox-node-agent.serviceAccountName" . }}
    namespace: {{ include "opensandbox-node-agent.namespace" . }}
{{- end }}
