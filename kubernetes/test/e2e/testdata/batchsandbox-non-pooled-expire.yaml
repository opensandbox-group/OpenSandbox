apiVersion: sandbox.opensandbox.io/v1alpha1
kind: BatchSandbox
metadata:
  name: {{.BatchSandboxName}}
  namespace: {{.Namespace}}
spec:
  replicas: {{.Replicas}}
  expireTime: "{{.ExpireTime}}"
  template:
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: sandbox-container
        image: {{.SandboxImage}}
        command: ["sleep", "3600"]
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
