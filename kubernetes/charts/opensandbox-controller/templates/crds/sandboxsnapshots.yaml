{{- if .Values.crds.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: sandboxsnapshots.sandbox.opensandbox.io
  labels:
    {{- include "opensandbox.labels" . | nindent 4 }}
spec:
  group: sandbox.opensandbox.io
  names:
    kind: SandboxSnapshot
    listKind: SandboxSnapshotList
    plural: sandboxsnapshots
    shortNames:
    - sbxsnap
    singular: sandboxsnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .spec.sandboxName
      name: SANDBOX
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SandboxSnapshotSpec defines the desired state of SandboxSnapshot.
              Pure atomic capability: caller fills spec, Controller only reads spec.
              Registry/snapshotPushSecret/snapshotType come from Controller Manager startup params.
            properties:
              sandboxName:
                description: |-
                  SandboxName is the name of the target BatchSandbox (same namespace as SandboxSnapshot).
                  Controller uses this to find BatchSandbox -> find Pod -> dispatch commit Job.
                type: string
            required:
            - sandboxName
            type: object
          status:
            description: |-
              SandboxSnapshotStatus defines the observed state of SandboxSnapshot.
              Status is written by Controller, read-only for callers.
            properties:
              conditions:
                description: Conditions records the readiness or failure of the snapshot.
                items:
                  description: SandboxSnapshotCondition represents a condition of
                    a SandboxSnapshot.
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable message about the condition.
                      type: string
                    reason:
                      description: Reason is a brief reason for the condition.
                      type: string
                    status:
                      description: Status is the condition status.
                      enum:
                      - "True"
                      - "False"
                      type: string
                    type:
                      description: Type is the condition type.
                      enum:
                      - Ready
                      - Failed
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              containers:
                description: Containers holds per-container snapshot results, filled
                  after Succeed.
                items:
                  description: ContainerSnapshot records the snapshot result for a
                    single container.
                  properties:
                    containerName:
                      description: ContainerName is the name of the container.
                      type: string
                    imageDigest:
                      description: ImageDigest is the config digest of the pushed snapshot
                        image.
                      type: string
                    imageUri:
                      description: ImageURI is the snapshot image URI for this container.
                      type: string
                  required:
                  - containerName
                  - imageUri
                  type: object
                type: array
              format:
                description: |-
                  Format identifies the snapshot representation. Empty means rootfs-v1 for
                  backward compatibility with snapshots created before this field existed.
                enum:
                - rootfs-v1
                - qemu-v1
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent spec generation
                  observed by the Controller.
                format: int64
                type: integer
              phase:
                description: Phase indicates the current phase of the snapshot.
                enum:
                - Pending
                - Committing
                - Succeed
                - Failed
                type: string
              sourceNodeName:
                description: SourceNodeName is the node where the source Pod runs
                  (for Job scheduling).
                type: string
              sourcePodName:
                description: SourcePodName is the name of the source Pod (resolved
                  by Controller).
                type: string
              virtualMachine:
                description: VirtualMachine contains the QEMU VM state artifact for
                  qemu-v1 snapshots.
                properties:
                  compatibility:
                    description: Compatibility contains the restore compatibility
                      summary.
                    properties:
                      architecture:
                        description: Architecture is the guest host architecture,
                          for example amd64.
                        type: string
                      cpuModel:
                        description: CPUModel is the configured virtual CPU model.
                        type: string
                      machineType:
                        description: MachineType is the versioned QEMU machine type.
                        type: string
                      memoryBytes:
                        description: MemoryBytes is the configured guest RAM in bytes.
                        format: int64
                        minimum: 1
                        type: integer
                      qemuConfigDigest:
                        description: QEMUConfigDigest identifies the normalized QEMU
                          launch configuration.
                        type: string
                      qemuVersion:
                        description: QEMUVersion is the source QEMU version string.
                        type: string
                      requiredNodeClass:
                        description: RequiredNodeClass optionally constrains restore
                          to a compatible node class.
                        type: string
                      vcpus:
                        description: VCPUs is the number of virtual CPUs.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - architecture
                    - cpuModel
                    - machineType
                    - memoryBytes
                    - qemuConfigDigest
                    - qemuVersion
                    - vcpus
                    type: object
                  compression:
                    description: Compression identifies the payload compression algorithm.
                    enum:
                    - zstd
                    type: string
                  imageDigest:
                    description: ImageDigest is the digest of the pushed standard
                      container image.
                    type: string
                  imageUri:
                    description: ImageURI is the repository and tag used when the
                      VM state image was pushed.
                    type: string
                  manifestDigest:
                    description: ManifestDigest identifies the compatibility manifest
                      stored in the image.
                    type: string
                  payloadDigest:
                    description: PayloadDigest is the digest of the compressed VM
                      state payload.
                    type: string
                  sizeBytes:
                    description: SizeBytes is the compressed VM state payload size.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - compatibility
                - compression
                - imageDigest
                - imageUri
                - manifestDigest
                - payloadDigest
                - sizeBytes
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
