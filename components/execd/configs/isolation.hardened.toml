# Hardened isolation configuration for the execd-as-init e2e (OSEP-0018,
# R-i). Injected into sandboxes via [docker] sandbox_env
# (EXECD_ISOLATION_CONFIG=/etc/opensandbox/isolation.toml) with a config-level
# bind mount, or via the opensandbox-e2e-execd-isolation ConfigMap on
# Kubernetes — so the whole server -> sandbox -> execd path runs with the
# floor on. Images can bake the same file in via COPY + ENV
# EXECD_ISOLATION_CONFIG instead.
#
# This is the "common cases" config from the OSEP: one line each for the
# floor and for filesystem confinement. Everything else stays built-in.

[hardening]
enabled = true

[landlock]
enabled = true
