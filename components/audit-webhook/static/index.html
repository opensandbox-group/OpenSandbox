<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙箱最新请求 - OpenSandbox 审计</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <h1>OpenSandbox 沙箱最新请求（总表）</h1>
  <div class="controls">
    <label><input type="checkbox" id="auto-refresh"> 自动刷新（10s）</label>
    <button class="primary" onclick="fetchLatest()">刷新</button>
    <button onclick="logout()">退出登录</button>
  </div>
</header>
<main>
  <section>
    <div class="toolbar">
      <input type="text" id="search-box" placeholder="按沙箱 ID 模糊搜索">
      <button class="primary" onclick="applySearch()">搜索</button>
      <div class="spacer"></div>
      <span class="muted" id="latest-total"></span>
    </div>
    <h2>点击沙箱 ID 查看该沙箱的请求详情；点击「最新请求时间」/「累计请求数」表头排序</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>沙箱 ID</th><th>最新 URI</th><th>方法</th><th>目标</th>
            <th class="sortable" onclick="toggleSort('request_time')">最新请求时间<span class="sort-indicator" id="sort-request_time"></span></th>
            <th class="sortable" onclick="toggleSort('request_count')">累计请求数<span class="sort-indicator" id="sort-request_count"></span></th>
          </tr>
        </thead>
        <tbody id="latest-body"></tbody>
      </table>
    </div>
    <div class="pager" id="latest-pager"></div>
    <div class="error" id="error-box"></div>
  </section>
</main>

<script>
const PAGE_SIZE = 50;
const state = { offset: 0, total: 0, search: "", sort: "-request_time" };

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function esc(text) {
  const el = document.createElement("span");
  el.textContent = text == null ? "" : String(text);
  return el.innerHTML;
}

function showError(msg) {
  const box = document.getElementById("error-box");
  box.style.display = msg ? "block" : "none";
  box.textContent = msg || "";
}

function gotoDetails(sandboxId) {
  window.location.href = "/details?sandbox_id=" + encodeURIComponent(sandboxId);
}

function applySearch() {
  state.search = document.getElementById("search-box").value.trim();
  state.offset = 0;
  fetchLatest();
}

function clearSearch() {
  document.getElementById("search-box").value = "";
  applySearch();
}

function toggleSort(column) {
  // Clicking a header toggles between descending and ascending; the
  // default state (descending, "-column") is the initial view.
  state.sort = state.sort === `-${column}` ? column : `-${column}`;
  state.offset = 0;
  updateSortIndicators();
  fetchLatest();
}

function updateSortIndicators() {
  const activeColumn = state.sort.replace(/^-/, "");
  const descending = state.sort.startsWith("-");
  for (const column of ["request_time", "request_count"]) {
    const el = document.getElementById(`sort-${column}`);
    if (el) el.textContent = column === activeColumn ? (descending ? " ▼" : " ▲") : "";
  }
}

function renderPager() {
  const from = state.total === 0 ? 0 : state.offset + 1;
  const to = Math.min(state.offset + PAGE_SIZE, state.total);
  const pager = document.getElementById("latest-pager");
  pager.innerHTML = "";
  const prev = document.createElement("button");
  prev.textContent = "上一页";
  prev.disabled = state.offset === 0;
  prev.onclick = () => { state.offset = Math.max(0, state.offset - PAGE_SIZE); fetchLatest(); };
  const next = document.createElement("button");
  next.textContent = "下一页";
  next.disabled = to >= state.total;
  next.onclick = () => { state.offset += PAGE_SIZE; fetchLatest(); };
  const info = document.createElement("span");
  info.textContent = ` ${from}-${to} / 共 ${state.total} 条 `;
  pager.append(prev, info, next);
}

async function fetchLatest() {
  try {
    const params = new URLSearchParams({
      limit: PAGE_SIZE,
      offset: state.offset,
      sort: state.sort,
    });
    if (state.search) params.set("search", state.search);
    const resp = await fetch(`/api/sandboxes?${params}`);
    if (resp.status === 401) { window.location.href = "/login"; return; }
    if (!resp.ok) throw new Error(`查询失败: HTTP ${resp.status}`);
    const data = await resp.json();
    state.total = data.total;
    document.getElementById("latest-total").textContent =
      state.search ? `匹配 "${state.search}" 共 ${data.total} 条` : `共 ${data.total} 条`;
    const tbody = document.getElementById("latest-body");
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="99" class="empty">暂无记录</td></tr>';
    } else {
      tbody.innerHTML = data.items.map((r) => `
        <tr>
          <td class="sandbox"><a class="link" onclick="gotoDetails('${esc(r.sandbox_id)}')">${esc(r.sandbox_id)}</a></td>
          <td class="uri" title="${esc(r.uri)}">${esc(r.uri)}</td>
          <td class="method method-${esc(r.method)}">${esc(r.method)}</td>
          <td>${esc(r.target)}</td>
          <td>${fmtTime(r.request_time)}</td>
          <td><span class="count">${r.request_count}</span></td>
        </tr>`).join("");
    }
    renderPager();
    showError("");
  } catch (err) {
    showError(`加载沙箱总表失败：${err.message}`);
  }
}

async function logout() {
  try { await fetch("/logout", { method: "POST" }); } catch (e) { /* ignore */ }
  window.location.href = "/login";
}

let autoRefreshTimer = null;
document.getElementById("auto-refresh").addEventListener("change", (e) => {
  if (e.target.checked) {
    autoRefreshTimer = setInterval(fetchLatest, 10000);
  } else {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
});

document.getElementById("search-box").addEventListener("keydown", (e) => {
  if (e.key === "Enter") applySearch();
});

updateSortIndicators();
fetchLatest();
</script>
</body>
</html>
