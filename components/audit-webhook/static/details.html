<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请求详情 - OpenSandbox 审计</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <h1>OpenSandbox 请求详情</h1>
  <div class="controls">
    <label><input type="checkbox" id="auto-refresh"> 自动刷新（10s）</label>
    <button class="primary" onclick="fetchDetails()">刷新</button>
    <button onclick="logout()">退出登录</button>
  </div>
</header>
<main>
  <p><a class="back-link" href="/">&larr; 返回总表</a></p>
  <section>
    <h2 id="page-title">请求详情</h2>
    <div class="toolbar">
      <input type="text" id="filter-sandbox" placeholder="按沙箱 ID 过滤，如 my-sandbox">
      <button onclick="applyFilter()">查询</button>
      <button id="clear-filter" onclick="clearFilter()" style="display:none">清除过滤</button>
      <div class="spacer"></div>
      <span class="muted" id="detail-total"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>沙箱 ID</th><th>URI</th><th>方法</th><th>目标</th>
            <th>请求时间</th><th>入库时间</th>
          </tr>
        </thead>
        <tbody id="detail-body"></tbody>
      </table>
    </div>
    <div class="pager" id="detail-pager"></div>
    <div class="error" id="error-box"></div>
  </section>
</main>

<script>
const PAGE_SIZE = 50;
const state = { offset: 0, total: 0, sandboxId: "" };

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function esc(text) {
  const el = document.createElement("span");
  el.textContent = text == null ? "" : String(text);
  return el.innerHTML;
}

function showError(msg) {
  const box = document.getElementById("error-box");
  box.style.display = msg ? "block" : "none";
  box.textContent = msg || "";
}

function updateClearButton() {
  document.getElementById("clear-filter").style.display =
    state.sandboxId ? "" : "none";
  document.getElementById("page-title").textContent = state.sandboxId
    ? `沙箱 "${state.sandboxId}" 的请求详情` : "请求详情";
}

function applyFilter() {
  state.sandboxId = document.getElementById("filter-sandbox").value.trim();
  state.offset = 0;
  updateClearButton();
  fetchDetails();
}

function clearFilter() {
  document.getElementById("filter-sandbox").value = "";
  applyFilter();
}

function renderPager() {
  const from = state.total === 0 ? 0 : state.offset + 1;
  const to = Math.min(state.offset + PAGE_SIZE, state.total);
  const pager = document.getElementById("detail-pager");
  pager.innerHTML = "";
  const prev = document.createElement("button");
  prev.textContent = "上一页";
  prev.disabled = state.offset === 0;
  prev.onclick = () => { state.offset = Math.max(0, state.offset - PAGE_SIZE); fetchDetails(); };
  const next = document.createElement("button");
  next.textContent = "下一页";
  next.disabled = to >= state.total;
  next.onclick = () => { state.offset += PAGE_SIZE; fetchDetails(); };
  const info = document.createElement("span");
  info.textContent = ` ${from}-${to} / 共 ${state.total} 条 `;
  pager.append(prev, info, next);
}

async function fetchDetails() {
  try {
    const params = new URLSearchParams({ limit: PAGE_SIZE, offset: state.offset });
    if (state.sandboxId) params.set("sandbox_id", state.sandboxId);
    const resp = await fetch(`/api/requests?${params}`);
    if (resp.status === 401) { window.location.href = "/login"; return; }
    if (!resp.ok) throw new Error(`查询失败: HTTP ${resp.status}`);
    const data = await resp.json();
    state.total = data.total;
    document.getElementById("detail-total").textContent =
      state.sandboxId ? `沙箱 "${state.sandboxId}" 共 ${data.total} 条` : `共 ${data.total} 条`;
    const tbody = document.getElementById("detail-body");
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="99" class="empty">暂无记录</td></tr>';
    } else {
      tbody.innerHTML = data.items.map((r) => `
        <tr>
          <td class="muted">${r.id}</td>
          <td class="sandbox">${esc(r.sandbox_id)}</td>
          <td class="uri" title="${esc(r.uri)}">${esc(r.uri)}</td>
          <td class="method method-${esc(r.method)}">${esc(r.method)}</td>
          <td>${esc(r.target)}</td>
          <td>${fmtTime(r.request_time)}</td>
          <td class="muted">${fmtTime(r.received_at)}</td>
        </tr>`).join("");
    }
    renderPager();
    showError("");
  } catch (err) {
    showError(`加载请求详情失败：${err.message}`);
  }
}

async function logout() {
  try { await fetch("/logout", { method: "POST" }); } catch (e) { /* ignore */ }
  window.location.href = "/login";
}

document.getElementById("filter-sandbox").addEventListener("keydown", (e) => {
  if (e.key === "Enter") applyFilter();
});

let autoRefreshTimer = null;
document.getElementById("auto-refresh").addEventListener("change", (e) => {
  if (e.target.checked) {
    autoRefreshTimer = setInterval(fetchDetails, 10000);
  } else {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
});

// Initialize from the URL: /details?sandbox_id=<id>
const initialSandboxId = new URLSearchParams(window.location.search).get("sandbox_id") || "";
state.sandboxId = initialSandboxId.trim();
document.getElementById("filter-sandbox").value = state.sandboxId;
updateClearButton();
fetchDetails();
</script>
</body>
</html>
