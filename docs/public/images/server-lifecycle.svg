<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1180" height="430" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">Sandbox lifecycle states</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Creation is asynchronous; pause/resume keeps the sandbox ID; terminal states reflect what happened to the workload.</text>

  <!-- main row -->
  <rect x="60" y="200" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="135" y="234" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Pending</text>

  <rect x="300" y="200" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="234" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Running</text>

  <!-- pause loop -->
  <rect x="560" y="70" width="140" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="630" y="102" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Pausing</text>

  <rect x="770" y="70" width="140" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="840" y="102" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Paused</text>

  <rect x="980" y="70" width="140" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1050" y="102" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Resuming</text>

  <!-- terminal row -->
  <rect x="300" y="320" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="354" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Stopping</text>

  <rect x="560" y="320" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="635" y="354" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Terminated</text>

  <rect x="820" y="320" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="895" y="354" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Failed</text>

  <!-- arrows -->
  <path d="M210,228 L294,228" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>
  <text x="216" y="216" font-size="11" fill="#64748b">ready</text>

  <path d="M375,200 L375,150 C375,118 420,96 554,96" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>
  <text x="392" y="120" font-size="11" fill="#2563eb">pause()</text>
  <path d="M700,96 L764,96" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>
  <path d="M910,96 L974,96" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>
  <path d="M1050,122 C1050,175 620,190 456,222" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>
  <text x="700" y="172" font-size="11" fill="#2563eb">resume()</text>

  <path d="M375,256 L375,314" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>
  <text x="383" y="290" font-size="11" fill="#64748b">delete / TTL</text>
  <path d="M450,348 L554,348" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" fill="none"/>

  <path d="M452,248 C620,290 760,308 814,330" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mG)" fill="none"/>
  <text x="620" y="292" font-size="11" fill="#64748b">exit ≠ 0 / crash</text>

  <!-- bottom bar -->
  <rect x="60" y="392" width="1060" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="412" font-size="11.5" fill="#475569">resume() works only from Paused · TTL is absolute and never resets · exit code 0 → Terminated, non-zero → Failed</text>
</svg>
