<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
<title id="title">Node Agent — from sandbox output to durable records</title>
<desc id="desc">On each Kubernetes node, sandbox pods write stdout and stderr to kubelet log files. The Node Agent DaemonSet tails those files with the container-logs source, or observes syscalls with an optional eBPF source, batches records through bounded per-sandbox queues, and writes them to one durable target: Alibaba Cloud OSS or durable local files. After the sink accepts a write durably, acknowledgements flow back through the pipeline and the source cursor advances in node-local recovery state. Each stream lands as numbered generations plus an immutable finalized marker that reports complete, complete-with-drops, or incomplete. Pooled warm pods are excluded.</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4L0 8Z" fill="#2563eb"/></marker>
<marker id="ack" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4L0 8Z" fill="#dc6b2e"/></marker>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#182636} .section{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#597080} .label{font-size:17px;fill:#597080} .body{font-size:18px;fill:#4d6173} .heading{font-size:22px;font-weight:600} .edge{font-size:16px;font-weight:500} </style>
</defs>
<rect width="1600" height="870" fill="#ffffff"/>
<text x="48" y="62" font-size="38" font-weight="700">Node Agent — from sandbox output to durable records</text>
<text x="48" y="96" class="body">One collector per node: tail sandbox streams, batch them through bounded queues, land each stream beside an honest completeness marker.</text>
<path d="M1150 54h36" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<text x="1196" y="60" class="edge" style="fill:#2563eb">Records</text>
<path d="M1330 54h36" fill="none" stroke="#dc6b2e" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ack)"/>
<text x="1376" y="60" class="edge" style="fill:#dc6b2e">Ack &amp; durable progress</text>

<!-- node -->
<rect x="48" y="128" width="404" height="560" rx="12" fill="#fafbfd" stroke="#d8e1e8" stroke-width="1.5"/>
<text x="72" y="162" class="section">KUBERNETES NODE</text>
<rect x="72" y="186" width="356" height="100" rx="8" fill="#ffffff" stroke="#dae5ef" stroke-width="1.5"/>
<text x="92" y="222" class="heading">Sandbox pod A</text>
<text x="92" y="254" class="body">sandbox container — stdout / stderr</text>
<text x="92" y="282" class="label">kubelet files under /var/log/pods</text>
<rect x="72" y="310" width="356" height="100" rx="8" fill="#ffffff" stroke="#dae5ef" stroke-width="1.5"/>
<text x="92" y="346" class="heading">Sandbox pod B</text>
<text x="92" y="378" class="body">sandbox container — stdout / stderr</text>
<text x="92" y="406" class="label">kubelet files under /var/log/pods</text>
<rect x="72" y="470" width="356" height="88" rx="8" fill="#ffffff" stroke="#c9d4de" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="92" y="506" class="heading">Pooled (warm) pod</text>
<text x="92" y="536" class="label">no sandbox identity — excluded</text>
<text x="72" y="660" class="label">selection by identity: sandbox ID + sandbox container</text>

<!-- agent -->
<rect x="500" y="128" width="560" height="560" rx="12" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5"/>
<text x="524" y="162" class="section">NODE AGENT</text>
<text x="700" y="162" class="label">DaemonSet · one per Linux node</text>
<rect x="540" y="186" width="480" height="104" rx="10" fill="#f1f6ff" stroke="#a9c7f3" stroke-width="1.5"/>
<text x="560" y="222" class="heading">Sources</text>
<text x="560" y="252" class="body">container-logs tails kubelet files · syscalls (opt-in)</text>
<text x="560" y="280" class="label">eBPF attached per sandbox cgroup</text>
<rect x="540" y="314" width="480" height="104" rx="10" fill="#ffffff" stroke="#dae5ef" stroke-width="1.5"/>
<text x="560" y="350" class="heading">Pipeline</text>
<text x="560" y="380" class="body">bounded per-sandbox queues · strict stream order</text>
<text x="560" y="408" class="label">block backpressure, or accounted drops</text>
<rect x="540" y="442" width="480" height="104" rx="10" fill="#ffffff" stroke="#dae5ef" stroke-width="1.5"/>
<text x="560" y="478" class="heading">Sink</text>
<text x="560" y="508" class="body">one durable target — batched record writes</text>
<text x="560" y="536" class="label">append + finalize, verified by size and checksum</text>
<rect x="540" y="570" width="480" height="94" rx="10" fill="#fff9f3" stroke="#efd7c4" stroke-width="1.5"/>
<text x="560" y="604" class="heading">Recovery state (node-local)</text>
<text x="560" y="636" class="label">checkpoints · finalize intents · bound to the target identity</text>

<path d="M720 292V310" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<text x="736" y="308" class="edge" style="fill:#2563eb">records</text>
<path d="M840 312V294" fill="none" stroke="#dc6b2e" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ack)"/>
<text x="872" y="308" class="edge" style="fill:#dc6b2e">acks</text>
<path d="M720 420V438" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M840 440V422" fill="none" stroke="#dc6b2e" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ack)"/>
<path d="M780 548V566" fill="none" stroke="#dc6b2e" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ack)"/>
<text x="796" y="562" class="edge" style="fill:#dc6b2e">durable write</text>

<!-- targets -->
<rect x="1108" y="128" width="444" height="560" rx="12" fill="#f4fbf8" stroke="#c6e4d7" stroke-width="1.5"/>
<text x="1132" y="162" class="section">DURABLE TARGETS</text>
<rect x="1132" y="186" width="396" height="140" rx="8" fill="#ffffff" stroke="#8bcbb0" stroke-width="1.5"/>
<text x="1152" y="222" class="heading">Alibaba Cloud OSS</text>
<text x="1152" y="252" class="body">appendable generations + immutable markers</text>
<text x="1152" y="280" class="label">credentials: append · read · write — never delete</text>
<text x="1152" y="304" class="label">deletion is a separate offline tool</text>
<rect x="1132" y="350" width="396" height="116" rx="8" fill="#ffffff" stroke="#8bcbb0" stroke-width="1.5"/>
<text x="1152" y="386" class="heading">Durable local files</text>
<text x="1152" y="416" class="body">same object-family layout, node-local</text>
<text x="1152" y="444" class="label">rotated under size, count, and volume caps</text>
<rect x="1132" y="490" width="396" height="174" rx="8" fill="#ffffff" stroke="#c6e4d7" stroke-width="1.5"/>
<text x="1152" y="524" class="heading">One family per stream</text>
<text x="1152" y="558" class="label">&lt;cluster&gt;/&lt;namespace&gt;/&lt;sandbox_id&gt;/</text>
<text x="1152" y="586" class="label">&lt;pod_uid&gt;/sandbox.&lt;generation&gt;.log</text>
<text x="1152" y="614" class="label">sandbox.finalized.&lt;revision&gt;.json</text>
<text x="1152" y="646" class="body">consumers verify by size and checksum</text>

<!-- cross arrows -->
<path d="M428 236L536 240" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<text x="440" y="228" class="edge" style="fill:#2563eb">tail &amp; stream</text>
<path d="M428 360L536 264" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M1020 476H1088V256H1124" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M1020 512H1104V408H1128" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="1028" y="450" width="150" height="24" fill="#ffffff"/>
<text x="1036" y="468" class="edge" style="fill:#2563eb">objects + marker</text>

<!-- markers strip -->
<rect x="48" y="728" width="1504" height="96" rx="10" fill="#f7f9fc" stroke="#d6e1e9" stroke-width="1.5"/>
<text x="72" y="764" class="heading">Completeness markers</text>
<text x="340" y="764" class="body">complete · complete-with-drops · incomplete — markers state what is provable, never optimistic</text>
<text x="72" y="798" class="label">at-least-once within the coverage window: duplicates are possible, unaccounted loss is not</text>
</svg>
