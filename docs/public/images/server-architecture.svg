<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
<title id="title">Server internal architecture</title>
<desc id="desc">Clients reach the FastAPI lifecycle server through middleware and thin API routers. The service layer exposes one SandboxService interface dispatching to Docker and to a CompositeSandboxService composing Kubernetes container providers with FastSandboxService, alongside snapshot, template and extension services. Repositories persist only snapshot metadata and the template catalog to SQLite or PostgreSQL. Tenant providers feed authentication, integrations add renew-on-access and telemetry, and the service layer delegates provisioning to runtime backends — Docker containers, Kubernetes resources or Fast Sandbox CRs — which are the source of truth for running sandboxes.</desc>
