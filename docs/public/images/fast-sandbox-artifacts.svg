<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1180" height="440" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">Artifact storage and delivery</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Everything a sandbox runs or resumes from is a content-addressed artifact in one store; nodes exchange blocks peer-to-peer.</text>

  <!-- builder -->
  <rect x="60" y="120" width="240" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="80" y="150" font-size="14" font-weight="700" fill="#0f172a">Template builder</text>
  <text x="80" y="174" font-size="11" fill="#475569">converts an OCI image into a</text>
  <text x="80" y="192" font-size="11" fill="#94a3b8">golden-image artifact (+ kernel)</text>

  <!-- artifact store -->
  <rect x="440" y="110" width="280" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="140" font-size="14" font-weight="700" fill="#0f172a">Artifact store (S3-compatible)</text>
  <text x="460" y="166" font-size="11" fill="#475569">golden images · snapshot checkpoints</text>
  <text x="460" y="184" font-size="11" fill="#475569">content-addressed, digest-referenced;</text>
  <text x="460" y="202" font-size="11" fill="#94a3b8">the single origin of sandbox state</text>

  <!-- node A -->
  <rect x="860" y="100" width="270" height="150" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="130" font-size="14" font-weight="700" fill="#0f172a">Node state-root</text>
  <text x="880" y="156" font-size="11" fill="#475569">per-node private cache (XFS reflink)</text>
  <text x="880" y="178" font-size="11" fill="#475569">fastlet-local artifacts for instant</text>
  <text x="880" y="196" font-size="11" fill="#94a3b8">sandbox starts; never shared across nodes</text>

  <!-- peers -->
  <rect x="860" y="290" width="270" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="318" font-size="13" font-weight="700" fill="#0f172a">DART daemons (per node)</text>
  <text x="880" y="342" font-size="11" fill="#475569">roster via headless Service; blocks</text>
  <text x="880" y="360" font-size="11" fill="#94a3b8">flow cache → peer → origin</text>

  <!-- arrows -->
  <path d="M300,165 L434,168" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="308" y="152" font-size="10.5" fill="#2563eb">publish</text>
  <path d="M720,150 L854,150" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="726" y="138" font-size="10.5" fill="#2563eb">first pull (4 MiB blocks)</text>
  <path d="M995,254 L995,284" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" fill="none"/>
  <text x="1003" y="274" font-size="10.5" fill="#64748b">serves peers</text>

  <!-- sandboxes -->
  <rect x="60" y="300" width="660" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="80" y="330" font-size="13" font-weight="700" fill="#0f172a">Sandboxes on any node</text>
  <text x="80" y="354" font-size="11" fill="#475569">started from node-local artifacts; pause/resume checkpoints round-trip through the same store, digest-pinned</text>

  <path d="M860,220 C700,280 500,320 470,332" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="560" y="272" font-size="10.5" fill="#2563eb">instant starts</text>

  <!-- bottom bar -->
  <rect x="60" y="396" width="1080" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="416" font-size="11.5" fill="#475569">Origin traffic is amortized cluster-wide: each block is fetched from the origin roughly once, then served peer-to-peer.</text>
</svg>
