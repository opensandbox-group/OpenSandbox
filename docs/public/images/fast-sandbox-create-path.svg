<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1180" height="470" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">The create hot path — what fast-sandbox removes</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Both paths persist durable intent; only the per-sandbox scheduling machinery differs.</text>

  <!-- k8s path -->
  <rect x="50" y="100" width="520" height="150" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="70" y="130" font-size="14" font-weight="700" fill="#0f172a">Per-pod backend (per sandbox)</text>
  <text x="70" y="156" font-size="11.5" fill="#475569">API write → scheduler → watch propagation → kubelet</text>
  <text x="70" y="174" font-size="11.5" fill=" #475569">reconciliation → runtime start (± image pull)</text>
  <text x="70" y="206" font-size="11" fill="#94a3b8">every sandbox pays the full Kubernetes machinery again;</text>
  <text x="70" y="224" font-size="11" fill="#94a3b8">pools remove the pod start, not the per-sandbox write path</text>

  <!-- fast path -->
  <rect x="50" y="280" width="520" height="150" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/>
  <text x="70" y="310" font-size="14" font-weight="700" fill="#0f172a">Fast Sandbox (per sandbox)</text>
  <text x="70" y="336" font-size="11.5" fill="#475569">one CRD write (durable intent) → in-memory placement</text>
  <text x="70" y="354" font-size="11.5" fill="#475569">→ atomic admission into a warm Fastlet → containerd</text>
  <text x="70" y="372" font-size="11.5" fill="#475569">starts the runtime directly</text>
  <text x="70" y="404" font-size="11" fill="#94a3b8">no scheduler, no watch wait, no kubelet — the cluster keeps</text>
  <text x="70" y="422" font-size="11" fill="#94a3b8">doing what it is good at: Fastlet pods, accounting, pool scheduling</text>

  <!-- flow -->
  <rect x="660" y="130" width="480" height="300" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="680" y="160" font-size="14" font-weight="700" fill="#0f172a">Admission, step by step</text>
  <text x="680" y="188" font-size="11.5" fill="#475569">1 · rank in-memory candidates (image-cache affinity,</text>
  <text x="680" y="206" font-size="11.5" fill="#475569">    then load, then stable hash)</text>
  <text x="680" y="232" font-size="11.5" fill="#475569">2 · persist one Sandbox CR — the complete initial intent</text>
  <text x="680" y="258" font-size="11.5" fill="#475569">3 · atomic admission on the chosen Fastlet; network slot</text>
  <text x="680" y="276" font-size="11.5" fill="#475569">    and policy bindings arrive before the runtime does</text>
  <text x="680" y="302" font-size="11.5" fill="#475569">4 · runtime starts from pre-pulled artifacts (warm images</text>
  <text x="680" y="320" font-size="11.5" fill="#475569">    are protected from cache eviction)</text>
  <text x="680" y="352" font-size="11" fill="#94a3b8">the network slot exists before the sandbox: no per-create</text>
  <text x="680" y="370" font-size="11" fill="#94a3b8">setup window, and policy can be late but never open</text>

  <path d="M300,254 L300,274" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" fill="none"/>
  <text x="310" y="268" font-size="10.5" fill="#64748b">same durability, less machinery</text>
</svg>
