<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="480" viewBox="0 0 1180 480" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1180" height="480" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">Egress — outbound control at two layers</text>
  <text x="40" y="58" font-size="12" fill="#64748b">The sidecar shares the sandbox's network namespace, so every outbound packet passes it — no application configuration, no way around it from inside.</text>

  <!-- shared netns -->
  <rect x="50" y="100" width="640" height="320" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7,5" filter="url(#sh)"/>
  <text x="70" y="128" font-size="13" font-weight="700" fill="#334155">Shared network namespace</text>

  <rect x="80" y="150" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="96" y="178" font-size="13" font-weight="700" fill="#0f172a">Sandbox workload</text>
  <text x="96" y="200" font-size="11" fill="#94a3b8">unprivileged · no NET_ADMIN</text>

  <rect x="80" y="290" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="96" y="318" font-size="13" font-weight="700" fill="#0f172a">Egress sidecar</text>
  <text x="96" y="340" font-size="11" fill="#94a3b8">holds the only NET_ADMIN</text>
  <text x="96" y="358" font-size="11" fill="#94a3b8">exits rather than run unenforced</text>

  <!-- layers -->
  <rect x="400" y="150" width="260" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="416" y="178" font-size="13" font-weight="700" fill="#0f172a">Layer 1 — DNS filter</text>
  <text x="416" y="200" font-size="11" fill="#475569">denied → NXDOMAIN · allowed → resolve,</text>
  <text x="416" y="218" font-size="11" fill="#94a3b8">resolved IPs feed the network layer</text>

  <rect x="400" y="290" width="260" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="416" y="318" font-size="13" font-weight="700" fill="#0f172a">Layer 2 — nftables verdict</text>
  <text x="416" y="340" font-size="11" fill="#475569">default-deny; static rules + bounded</text>
  <text x="416" y="358" font-size="11" fill="#94a3b8">leases on DNS-learned addresses</text>

  <path d="M300,180 L394,182" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="308" y="168" font-size="10.5" fill="#2563eb">DNS :53</text>
  <path d="M300,330 L394,332" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="306" y="318" font-size="10.5" fill="#2563eb">TCP 80/443</text>
  <path d="M530,240 L530,284" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" fill="none"/>
  <text x="538" y="268" font-size="10.5" fill="#64748b">resolved IPs</text>

  <!-- external -->
  <ellipse cx="530" cy="430" rx="90" ry="14" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="530" y="434" font-size="10.5" fill="#475569" text-anchor="middle">external network</text>
  <path d="M530,380 L530,412" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="538" y="402" font-size="10.5" fill="#64748b">allowed</text>

  <!-- policy + vault -->
  <rect x="740" y="110" width="400" height="150" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="140" font-size="14" font-weight="700" fill="#0f172a">Who writes the policy?</text>
  <text x="760" y="166" font-size="11.5" fill="#475569">1 · platform overlays — deny.always / allow.always,</text>
  <text x="760" y="184" font-size="11.5" fill="#475569">    hot-reloaded, users cannot override</text>
  <text x="760" y="210" font-size="11.5" fill="#475569">2 · your policy — per sandbox, by FQDN / wildcard /</text>
  <text x="760" y="228" font-size="11.5" fill="#475569">    IP / CIDR, mutable at runtime</text>
  <text x="760" y="250" font-size="11" fill="#94a3b8">first match wins; the platform's deny always beats your allow</text>

  <rect x="740" y="290" width="400" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="320" font-size="14" font-weight="700" fill="#0f172a">Credentials stay outside</text>
  <text x="760" y="346" font-size="11.5" fill="#475569">with transparent TLS interception, matching outbound</text>
  <text x="760" y="364" font-size="11.5" fill="#475569">requests are authenticated by the sidecar —</text>
  <text x="760" y="382" font-size="11.5" fill="#475569">the sandbox never holds the secret</text>
  <text x="760" y="404" font-size="11" fill="#94a3b8">vault is in-memory · bindings are host-scoped</text>
</svg>
