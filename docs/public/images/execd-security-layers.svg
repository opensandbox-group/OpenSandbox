<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1160" height="500" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">Layered execution security</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Layers compose: the sandbox boundary always applies, the floor applies to every user process, isolated sessions add a namespace per execution.</text>

  <!-- layer 1 -->
  <rect x="60" y="100" width="800" height="326" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="84" y="132" font-size="14" font-weight="700" fill="#0f172a">Layer 1 — Sandbox boundary</text>
  <text x="84" y="154" font-size="11" fill="#94a3b8">runtime isolation set by the platform at create time</text>

  <!-- layer 2 -->
  <rect x="100" y="176" width="720" height="250" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#sh)"/>
  <text x="124" y="206" font-size="14" font-weight="700" fill="#0f172a">Layer 2 — Hardening floor (every user process)</text>
  <text x="124" y="228" font-size="11" fill="#94a3b8">capabilities dropped · no_new_privs · seccomp denylist · Landlock allowlist</text>

  <!-- layer 3 -->
  <rect x="140" y="252" width="640" height="140" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#sh)"/>
  <text x="164" y="282" font-size="14" font-weight="700" fill="#0f172a">Layer 3 — Isolated session (optional, per execution)</text>
  <text x="164" y="304" font-size="11" fill="#94a3b8">private namespace · read-only binds · writable allowlist</text>

  <rect x="180" y="322" width="560" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="354" font-size="13" font-weight="700" fill="#0f172a">Your process</text>

  <!-- audit -->
  <rect x="910" y="176" width="210" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5,4" filter="url(#sh)"/>
  <text x="928" y="206" font-size="13" font-weight="700" fill="#0f172a">eBPF observer</text>
  <text x="928" y="230" font-size="11" fill="#475569">optional, off by default</text>
  <text x="928" y="254" font-size="11" fill="#475569">exec · connect · privilege</text>
  <text x="928" y="272" font-size="11" fill="#475569">events, sandbox-scoped</text>
  <text x="928" y="290" font-size="11" fill="#94a3b8">JSONL audit log</text>

  <path d="M860,250 L904,250" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="860" y="238" font-size="10.5" fill="#2563eb">events</text>

  <!-- bottom bar -->
  <rect x="60" y="440" width="1060" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="460" font-size="11.5" fill="#475569">Every layer reports its state — active, degraded, or unsupported — so clients can verify what is actually enforced.</text>
</svg>
