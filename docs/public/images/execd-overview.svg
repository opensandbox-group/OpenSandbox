<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1180" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">execd — the single entry point into a sandbox</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Every client talks to one daemon; every capability is one API away.</text>

  <!-- clients -->
  <rect x="50" y="130" width="210" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="66" y="162" font-size="13" font-weight="700" fill="#0f172a">SDKs</text>

  <rect x="50" y="202" width="210" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="66" y="234" font-size="13" font-weight="700" fill="#0f172a">osb CLI</text>

  <rect x="50" y="274" width="210" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="66" y="306" font-size="13" font-weight="700" fill="#0f172a">MCP server</text>

  <rect x="50" y="346" width="210" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="66" y="378" font-size="13" font-weight="700" fill="#0f172a">Lifecycle server</text>

  <!-- sandbox -->
  <rect x="360" y="100" width="780" height="380" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7,5" filter="url(#sh)"/>
  <text x="380" y="128" font-size="13" font-weight="700" fill="#334155">Sandbox</text>

  <rect x="390" y="150" width="260" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="406" y="180" font-size="15" font-weight="700" fill="#0f172a">execd</text>
  <text x="406" y="204" font-size="11.5" fill="#475569">in-sandbox daemon · port 44772</text>
  <text x="406" y="224" font-size="11" fill="#94a3b8">shared access token enforced</text>

  <rect x="390" y="330" width="260" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="406" y="360" font-size="13" font-weight="700" fill="#0f172a">Your workload</text>
  <text x="406" y="384" font-size="11" fill="#94a3b8">supervised by execd: signals,</text>
  <text x="406" y="402" font-size="11" fill="#94a3b8">exit codes, child reaping</text>

  <path d="M520,326 L520,274" stroke="#64748b" stroke-width="1.8" marker-end="url(#mG)" fill="none"/>
  <text x="528" y="304" font-size="10.5" fill="#64748b">supervision</text>

  <!-- capabilities -->
  <rect x="760" y="140" width="340" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="776" y="174" font-size="13" font-weight="700" fill="#0f172a">Command execution</text>

  <rect x="760" y="212" width="340" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="776" y="246" font-size="13" font-weight="700" fill="#0f172a">Code execution</text>

  <rect x="760" y="284" width="340" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="776" y="318" font-size="13" font-weight="700" fill="#0f172a">Interactive terminals</text>

  <rect x="760" y="356" width="340" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="776" y="390" font-size="13" font-weight="700" fill="#0f172a">Files and directories</text>

  <rect x="760" y="428" width="340" height="40" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="776" y="454" font-size="13" font-weight="700" fill="#0f172a">Metrics</text>

  <!-- arrows -->
  <path d="M260,156 L384,196" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M260,228 L384,218" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M260,300 L384,246" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M260,372 L384,240" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <text x="290" y="176" font-size="11" fill="#2563eb">execd API</text>
  <path d="M650,190 L754,168" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M650,214 L754,240" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M650,238 L754,312" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M650,258 L754,384" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
  <path d="M650,268 L754,448" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" fill="none"/>
</svg>
