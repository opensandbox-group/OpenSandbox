<text x="1176" y="472" class="heading">Files and directories</text>
<rect x="1156" y="514" width="372" height="64" rx="8" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.5"/>
<text x="1176" y="554" class="heading">Metrics</text>

